<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alifo — Alif Med Past Year Exams</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>"
    />
    <style>
      :root {
        --bg: #0a0e14;
        --bg-2: #10151d;
        --bg-3: #171d28;
        --card: #121821;
        --card-hover: #1a2130;
        --border: #1f2836;
        --border-2: #2b3648;
        --text: #e6edf3;
        --text-dim: #8b949e;
        --text-faint: #5a6472;
        --accent: #a855f7;
        --accent-2: #ec4899;
        --blue: #4d9fff;
        --blue-soft: #7fb3ff;
        --green: #2ecc71;
        --green-bg: #123a25;
        --green-border: #1e5c3a;
        --red: #e74c3c;
        --red-bg: #3a1818;
        --red-border: #5c2424;
        --yellow: #f5b800;
        --radius: 16px;
        --radius-sm: 10px;
        --radius-xs: 8px;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      }
      html[data-theme="light"] {
        --bg: #f6f7f9;
        --bg-2: #eef0f4;
        --bg-3: #e3e7ee;
        --card: #ffffff;
        --card-hover: #f0f2f6;
        --border: #dde1e8;
        --border-2: #c7cdd8;
        --text: #1a2230;
        --text-dim: #5a6472;
        --text-faint: #8b949e;
        --green-bg: #e6f7ed;
        --green-border: #b7e2c8;
        --red-bg: #fdecea;
        --red-border: #f4c1bb;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      }
      html[data-theme="light"] .hero {
        background: linear-gradient(
          135deg,
          rgba(168, 85, 247, 0.08),
          rgba(236, 72, 153, 0.05)
        );
      }
      html[data-theme="light"] .explanation {
        background: rgba(77, 159, 255, 0.06);
        border-color: rgba(77, 159, 255, 0.28);
      }
      html[data-theme="light"] .explanation.why-not {
        background: rgba(168, 85, 247, 0.06);
        border-color: rgba(168, 85, 247, 0.28);
      }
      html[data-theme="light"] .q-number,
      html[data-theme="light"] .q-topic {
        background: rgba(77, 159, 255, 0.08);
        border-color: rgba(77, 159, 255, 0.35);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        overscroll-behavior-y: none;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
        font-size: inherit;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-2);
        border-radius: 4px;
      }

      #app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding-bottom: 24px;
      }

      /* ========== TOP BAR ========== */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px 10px;
        position: sticky;
        top: 0;
        z-index: 20;
        background: linear-gradient(180deg, var(--bg) 75%, transparent);
        backdrop-filter: blur(10px);
      }
      .logo-wrap {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .logo-badge {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: linear-gradient(135deg, #a855f7, #ec4899);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 12px;
        color: #fff;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 14px rgba(168, 85, 247, 0.35);
      }
      .logo-text {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.3px;
      }
      .logo-sub {
        font-size: 11px;
        color: var(--text-dim);
        font-weight: 500;
      }
      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--bg-3);
        border: 1px solid var(--border-2);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-dim);
      }

      /* ========== BREADCRUMB ========== */
      .crumbs {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 18px 14px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-dim);
        flex-wrap: wrap;
      }
      .crumb {
        color: var(--text-dim);
        transition: color 0.15s;
        padding: 2px 0;
      }
      .crumb.link {
        cursor: pointer;
      }
      .crumb.link:hover {
        color: var(--accent);
      }
      .crumb.current {
        color: var(--text);
        font-weight: 700;
      }
      .crumb-sep {
        opacity: 0.35;
      }

      /* ========== HERO ========== */
      .hero {
        margin: 0 18px 20px;
        padding: 22px 20px;
        border-radius: 18px;
        background: linear-gradient(
          135deg,
          rgba(168, 85, 247, 0.12),
          rgba(236, 72, 153, 0.08)
        );
        border: 1px solid var(--border);
        position: relative;
        overflow: hidden;
      }
      .hero::before {
        content: "";
        position: absolute;
        top: -40px;
        right: -40px;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(236, 72, 153, 0.25),
          transparent 70%
        );
        pointer-events: none;
      }
      .hero-title {
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 6px;
        letter-spacing: -0.3px;
      }
      .hero-sub {
        font-size: 13px;
        color: var(--text-dim);
        line-height: 1.55;
      }

      /* ========== SECTION TITLE ========== */
      .section-title {
        font-size: 11px;
        font-weight: 800;
        color: var(--text-faint);
        text-transform: uppercase;
        letter-spacing: 1.2px;
        padding: 0 18px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .section-title .count {
        background: var(--bg-3);
        color: var(--text-dim);
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
      }

      /* ========== LIST / CARD ========== */
      .list {
        padding: 0 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .course-card {
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        text-align: left;
        width: 100%;
        transition:
          transform 0.15s,
          border-color 0.2s,
          background 0.2s;
        position: relative;
        overflow: hidden;
      }
      .course-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: var(--course-color, var(--accent));
        opacity: 0;
        transition: opacity 0.2s;
      }
      .course-card:hover::before {
        opacity: 1;
      }
      .course-card:hover {
        background: var(--card-hover);
        border-color: var(--border-2);
      }
      .course-card:active {
        transform: scale(0.985);
      }
      .course-thumb {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        font-size: 24px;
        background: var(--course-bg, rgba(168, 85, 247, 0.12));
        border: 1px solid var(--course-border, rgba(168, 85, 247, 0.3));
      }
      .course-body {
        flex: 1;
        min-width: 0;
      }
      .course-title {
        font-size: 16px;
        font-weight: 800;
        margin-bottom: 4px;
        letter-spacing: -0.2px;
      }
      .course-meta {
        font-size: 12px;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .course-meta .dot {
        opacity: 0.4;
      }
      .progress-bar {
        margin-top: 10px;
        height: 5px;
        background: var(--bg-3);
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(
          90deg,
          var(--course-color, var(--accent)),
          var(--course-color-2, var(--accent-2))
        );
        transition: width 0.4s ease;
      }
      .course-arrow {
        color: var(--text-faint);
        flex-shrink: 0;
      }

      /* ========== EXAM QUIZ VIEW ========== */
      .quiz-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--bg);
        opacity: 0.96;
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--bg-3);
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        flex-shrink: 0;
        transition: all 0.2s;
      }
      .icon-btn:hover {
        background: var(--card-hover);
        border-color: var(--border-2);
      }
      .icon-btn:active {
        transform: scale(0.95);
      }
      .quiz-header-info {
        flex: 1;
        text-align: center;
        min-width: 0;
      }
      .quiz-header-title {
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .quiz-header-count {
        font-size: 11px;
        color: var(--text-dim);
        margin-top: 1px;
        font-weight: 600;
      }

      .quiz-progress {
        height: 3px;
        background: var(--bg-3);
        position: sticky;
        top: 65px;
        z-index: 19;
      }
      .quiz-progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width 0.3s ease;
      }

      .quiz-body {
        padding: 22px 18px 30px;
        flex: 1;
        max-width: 720px;
        margin: 0 auto;
        width: 100%;
      }

      /* Plate header — the timeline vibe from the screenshot */
      .plate-rail {
        position: relative;
        padding-left: 26px;
        margin-bottom: 22px;
      }
      .plate-rail::before {
        content: "";
        position: absolute;
        left: 8px;
        top: 6px;
        bottom: -18px;
        width: 1.5px;
        background: linear-gradient(
          180deg,
          rgba(77, 159, 255, 0.45),
          rgba(77, 159, 255, 0.08)
        );
      }
      .plate-dot {
        position: absolute;
        left: 4px;
        top: 6px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 0 3px rgba(77, 159, 255, 0.15);
      }
      .plate-label {
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 1.6px;
        color: var(--blue-soft);
        text-transform: uppercase;
        margin-bottom: 6px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      .plate-title {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.3px;
        line-height: 1.15;
        color: var(--text);
      }
      .plate-section {
        margin-top: 8px;
        font-size: 13px;
        color: var(--text-dim);
        font-family: Georgia, serif;
        font-style: italic;
      }

      /* Question tag row */
      .q-tag-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .q-tag-left {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .q-number {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
        font-weight: 800;
        color: var(--blue-soft);
        letter-spacing: 0.6px;
        padding: 4px 9px;
        border: 1px solid rgba(77, 159, 255, 0.28);
        border-radius: 6px;
        background: rgba(77, 159, 255, 0.06);
      }
      .q-plate-tag {
        display: block;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 1.2px;
        color: var(--blue-soft);
        text-transform: uppercase;
        margin-bottom: 10px;
        padding: 0;
        opacity: 0.9;
      }
      .q-plate-tag::before {
        content: "▸ ";
        opacity: 0.6;
      }
      .q-topic {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.8px;
        padding: 4px 9px;
        border-radius: 6px;
        color: var(--blue-soft);
        background: rgba(77, 159, 255, 0.1);
        text-transform: uppercase;
      }
      .q-meta-badges {
        display: flex;
        gap: 6px;
      }
      .meta-badge.streak {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.5px;
        padding: 4px 9px;
        border-radius: 7px;
        text-transform: uppercase;
        color: var(--yellow);
        background: rgba(245, 184, 0, 0.14);
      }

      /* Question text — serif */
      .q-text {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 21px;
        font-weight: 700;
        line-height: 1.35;
        margin-bottom: 20px;
        color: var(--text);
        letter-spacing: -0.1px;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
      }
      .option {
        display: flex;
        align-items: flex-start;
        gap: 13px;
        background: var(--card);
        border: 1.5px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        text-align: left;
        font-size: 14.5px;
        line-height: 1.5;
        color: var(--text);
        transition: all 0.18s;
        width: 100%;
      }
      .option:hover:not(.locked) {
        border-color: var(--blue);
        background: var(--card-hover);
      }
      .option:active:not(.locked) {
        transform: scale(0.99);
      }
      .option .letter {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: var(--bg-3);
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 800;
        color: var(--text-dim);
        flex-shrink: 0;
        transition: all 0.2s;
      }
      .option.correct {
        background: var(--green-bg);
        border-color: var(--green-border);
      }
      .option.correct .letter {
        background: var(--green);
        color: #fff;
        border-color: var(--green);
      }
      .option.wrong {
        background: var(--red-bg);
        border-color: var(--red-border);
      }
      .option.wrong .letter {
        background: var(--red);
        color: #fff;
        border-color: var(--red);
      }
      .option.locked {
        cursor: default;
      }

      .result-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13.5px;
        font-weight: 800;
        margin-bottom: 16px;
        padding: 11px 15px;
        border-radius: 11px;
        letter-spacing: 0.2px;
        animation: slideDown 0.25s ease;
      }
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .result-row.correct {
        color: var(--green);
        background: rgba(46, 204, 113, 0.08);
        border: 1px solid var(--green-border);
      }
      .result-row.wrong {
        color: var(--red);
        background: rgba(231, 76, 60, 0.08);
        border: 1px solid var(--red-border);
      }

      .action-btns {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .action-btn {
        padding: 10px 18px;
        border-radius: 999px;
        background: transparent;
        border: 1px solid var(--border-2);
        font-size: 13px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        transition: all 0.2s;
        color: var(--text);
      }
      .action-btn:hover {
        border-color: var(--blue);
        background: rgba(77, 159, 255, 0.06);
      }
      .action-btn.active {
        background: rgba(77, 159, 255, 0.12);
        border-color: var(--blue);
        color: var(--blue-soft);
      }

      /* Explanation box — bordered like screenshot */
      .explanation {
        background: rgba(77, 159, 255, 0.03);
        border: 1px solid rgba(77, 159, 255, 0.18);
        border-radius: 12px;
        padding: 18px 20px;
        margin-bottom: 20px;
        animation: slideDown 0.25s ease;
      }
      .explanation-label {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 1.4px;
        color: var(--blue-soft);
        text-transform: uppercase;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .explanation-label::before {
        content: "";
        display: inline-block;
        width: 16px;
        height: 1px;
        background: var(--blue-soft);
      }
      .explanation.why-not {
        background: rgba(168, 85, 247, 0.03);
        border-color: rgba(168, 85, 247, 0.18);
      }
      .explanation.why-not .explanation-label {
        color: #c084fc;
      }
      .explanation.why-not .explanation-label::before {
        background: #c084fc;
      }
      .explanation-text {
        font-size: 14px;
        line-height: 1.7;
        color: var(--text-dim);
        font-family: Georgia, "Times New Roman", serif;
      }
      .explanation-text strong {
        color: var(--text);
        font-weight: 700;
      }
      .explanation-text br {
        line-height: 1.7;
      }

      .q-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 22px;
        padding: 14px;
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .q-nav-btn {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: var(--bg-3);
        border: 1px solid var(--border);
        font-size: 12px;
        font-weight: 800;
        color: var(--text-dim);
        transition: all 0.15s;
      }
      .q-nav-btn:hover {
        border-color: var(--border-2);
        color: var(--text);
      }
      .q-nav-btn.current {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #fff;
        border-color: transparent;
        transform: scale(1.05);
      }
      .q-nav-btn.answered-correct {
        background: var(--green-bg);
        color: var(--green);
        border-color: var(--green-border);
      }
      .q-nav-btn.answered-wrong {
        background: var(--red-bg);
        color: var(--red);
        border-color: var(--red-border);
      }

      .nav-buttons {
        display: flex;
        gap: 10px;
        margin-top: 8px;
      }
      .nav-btn {
        flex: 1;
        padding: 15px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 800;
        background: var(--bg-3);
        border: 1px solid var(--border);
        transition: all 0.2s;
        letter-spacing: 0.2px;
      }
      .nav-btn:hover:not(:disabled) {
        background: var(--card-hover);
        border-color: var(--border-2);
      }
      .nav-btn.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-color: transparent;
        color: #fff;
        box-shadow: 0 4px 14px rgba(168, 85, 247, 0.3);
      }
      .nav-btn.primary:hover:not(:disabled) {
        box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
        transform: translateY(-1px);
      }
      .nav-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      /* ========== FINISH ========== */
      .finish-card {
        margin: 20px 18px;
        padding: 32px 24px;
        background: linear-gradient(
          135deg,
          rgba(168, 85, 247, 0.08),
          rgba(236, 72, 153, 0.08)
        );
        border: 1px solid var(--border);
        border-radius: 20px;
        text-align: center;
      }
      .finish-emoji {
        font-size: 56px;
        margin-bottom: 12px;
        display: block;
      }
      .finish-title {
        font-size: 24px;
        font-weight: 800;
        margin-bottom: 8px;
        letter-spacing: -0.4px;
      }
      .finish-sub {
        font-size: 14px;
        color: var(--text-dim);
        margin-bottom: 24px;
        line-height: 1.6;
      }
      .finish-score {
        font-size: 52px;
        font-weight: 900;
        letter-spacing: -1.5px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));

 is the major cause of muscle fatigue. Keep in mind current research has nuanced this considerably, emphasizing phosphate and calcium-handling factors too.<br><br>🧠 <strong>One-line memory rule:</strong> "Lactate builds up → pH drops → muscle struggles (the traditional story)."',

                "<strong>Answer: B — NADH and the ATP/ADP ratio</strong><br><br>⚡ <strong>Key idea:</strong> <em>Whether pyruvate proceeds into the aerobic (mitochondrial) pathway or is instead reduced to lactate depends on the redox and energy state of the cell — specifically the NADH/NAD+ ratio and the ATP/ADP ratio. When oxygen is limited, NADH accumulates and can't be reoxidized via the electron transport chain, forcing pyruvate to accept those electrons (via lactate dehydrogenase) to regenerate NAD+ and keep glycolysis running.</em><br><br>🧠 <strong>Understand the Concept — The logic of aerobic vs. anaerobic branching:</strong><br><br>1. Glycolysis always produces NADH and pyruvate, regardless of oxygen availability.<br>2. With adequate oxygen: NADH is reoxidized by the electron transport chain; pyruvate enters the mitochondria for the TCA cycle and oxidative phosphorylation (high ATP yield).<br>3. With limited oxygen (or very high demand): NADH can't be reoxidized fast enough; pyruvate is instead reduced to lactate (regenerating NAD+), allowing glycolysis to continue anaerobically (lower ATP yield, but fast).<br>4. The ATP/ADP ratio also signals overall energy status — low ATP/high ADP favors continued glycolytic flux to meet demand.<br><br>Key concept: The switch between aerobic and anaerobic glucose oxidation is fundamentally a story about regenerating NAD+ fast enough to keep glycolysis running — that's exactly what the NADH/NAD+ and ATP/ADP ratios reflect.<br><br>🎓 <strong>Exam Takeaway:</strong> The redox state (NADH/NAD) and energy state (ATP/ADP) of the cell determine whether glucose is oxidized aerobically or anaerobically - it's fundamentally about how fast NAD+ can be regenerated.<br><br>🧠 <strong>One-line memory rule:</strong> \"No oxygen to clear NADH - lactate takes over to keep glycolysis alive.\"",

uilds bone outside the cell."',

                '<strong>Answer: C — Iron</strong><br><br>⚡ <strong>Key idea:</strong> <em>Collagen\'s characteristic strength comes from hydroxylation of proline and lysine residues, catalyzed by prolyl hydroxylase and lysyl hydroxylase. Both enzymes require Fe²⁺ (iron) as a cofactor, alongside vitamin C (ascorbate), which keeps that iron in its active reduced state. Without either iron or vitamin C, hydroxylation fails and collagen becomes structurally weak — the basis of scurvy.</em><br><br>🧠 <strong>Understand the Concept — The hydroxylation reaction, ingredient list:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>REQUIREMENT</strong></td><td><strong>ROLE</strong></td></tr><tr><td>Prolyl/lysyl hydroxylase</td><td>The enzyme doing the hydroxylation</td></tr><tr><td>Fe²⁺ (iron)</td><td>Cofactor at the enzyme\'s active site</td></tr><tr><td>Vitamin C (ascorbate)</td><td>Reduces Fe³⁺ back to active Fe²⁺ after each catalytic cycle</td></tr><tr><td>α-ketoglutarate + O₂</td><td>Co-substrates consumed in the reaction</td></tr></table><br>Why this matters clinically: In vitamin C deficiency (scurvy), iron in the enzyme\'s active site gets oxidized to Fe³⁺ and stays inactive, halting proline/lysine hydroxylation — producing under-hydroxylated, unstable collagen that leads to bleeding gums, poor wound healing, and weakened blood vessels.<br><br>Key concept: Vitamin C\'s specific job is to regenerate the iron cofactor, not to replace it — the two work as a team, which is exactly what this question is testing.<br><br>🎓 <strong>Exam Takeaway:</strong> Vitamin C and iron work together in collagen hydroxylation - iron is the enzyme cofactor; vitamin C keeps that iron in its active, reduced state.<br><br>🧠 <strong>One-line memory rule:</strong> "Vitamin C recharges the iron that builds collagen."',

              explanation:
                '<strong>Answer: A — Lysyl oxidase</strong><br><br>⚡ <strong>Key idea:</strong> <em>Lysyl oxidase is a copper-dependent enzyme that oxidatively deaminates specific lysine and hydroxylysine residues on collagen (and elastin) molecules, generating reactive aldehyde groups. These aldehydes then spontaneously form covalent crosslinks between adjacent collagen molecules — the crosslinking step that gives mature collagen fibers their tensile strength.</em><br><br>🧠 <strong>Understand the Concept — Crosslinking, step by step:</strong><br><br>1. Procollagen is secreted and cleaved to tropocollagen.<br>2. Tropocollagen molecules self-assemble into fibrils.<br>3. Lysyl oxidase oxidizes specific lysine/hydroxylysine side chains → forms reactive aldehydes.<br>4. These aldehydes spontaneously react with neighboring aldehydes or unmodified lysines → covalent crosslinks form between adjacent collagen molecules.<br>5. Crosslinking converts individually weak collagen strands into a mechanically strong, insoluble fibril network.<br><br>Clinical relevance: Defects in lysyl oxidase (as in copper deficiency, or genetic disorders like Menkes disease) result in weak, poorly crosslinked collagen and connective tissue fragility.<br><br>Key concept: Lysyl oxidase is the specific "molecular stapler" of collagen biosynthesis - without it, collagen fibrils remain loosely associated and mechanically weak.<br><br>🎓 <strong>Exam Takeaway:</strong> Lysyl oxidase is the copper-dependent enzyme that crosslinks collagen (and elastin) fibers, giving them their mechanical strength.<br><br>🧠 <strong>One-line memory rule:</strong> "Lysyl oxidase = the molecular stapler of collagen."',

cularly in elderly patients with long-standing, extensive disease.<br><br>🧠 <strong>One-line memory rule:</strong> "Paget\'s biggest fear: turning into osteosarcoma."',

yelitis route overall (especially in children). Direct inoculation/contiguous spread is important, but not the single most common route in general.<br><br>🎓 <strong>Exam Takeaway:</strong> Hematogenous spread (via the bloodstream), not direct inoculation from adjacent infection, is the most common overall route of pyogenic osteomyelitis, especially classically in children.<br><br>🧠 <strong>One-line memory rule:</strong> "Osteomyelitis usually travels by blood, not by direct spread."',

ing nature — distinct from the other, generally manageable complications.<br><br>🎓 <strong>Exam Takeaway:</strong> Osteosarcoma is the most feared complication of Paget disease - a life-threatening malignant transformation, distinct from the disease\'s other, more manageable complications.<br><br>🧠 <strong>One-line memory rule:</strong> "Paget\'s worst fear: turning malignant (osteosarcoma)."',

ite for osteosarcoma.<br><br>🧠 <strong>One-line memory rule:</strong> "Ewing = diaphysis (shaft). Osteosarcoma = metaphysis (near the joint)."',

              correct: "D",
              explanation: '<strong>Answer: D — Acting as a \'relaxing protein\' at rest by covering up the sites where myosin binds to actin</strong><br><br>Key idea: Tropomyosin is a long, filamentous protein that wraps around the actin (thin filament) in skeletal muscle. At rest, it physically blocks the myosin-binding sites on actin, preventing cross-bridge formation and keeping the muscle relaxed. It does not generate ATP, slide, or bind myosin directly.<br><br><strong>Understand the Concept</strong><br>The Thin Filament Regulatory Complex:<br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>PROTEIN</strong></td><td><strong>FUNCTION</strong></td></tr><tr><td>Actin</td><td>Thin filament; contains myosin-binding sites</td></tr><tr><td>Tropomyosin</td><td>Blocking protein — covers myosin-binding sites at rest</td></tr><tr><td>Troponin</td><td>Ca2+ sensor — binds Ca2+ and moves tropomyosin</td></tr></table><br><strong>Sequence of events:</strong><br>1. Resting state: Tropomyosin covers the myosin-binding sites on actin → no cross-bridges → muscle relaxed.<br>2. Ca2+ released from SR → binds to troponin C.<br>3. Troponin complex undergoes conformational change → pulls tropomyosin away from the binding sites.<br>4. Myosin heads can now bind actin → cross-bridge cycle → contraction.<br><br>Key concept: Tropomyosin is often called a "relaxing protein" because it keeps the muscle relaxed by sterically hindering the actin-myosin interaction. It does not actively "relax" the muscle — it simply prevents contraction until Ca2+ signals otherwise.<br><br><strong>Exam Takeaway</strong><br>Tropomyosin is a \'relaxing protein\' that blocks myosin-binding sites on actin at rest. Ca2+-troponin binding moves tropomyosin, exposing sites and allowing contraction.<br><br><strong>One-line memory rule:</strong><br>"Tropomyosin = the roadblock; troponin = the traffic cop; Ca2+ = the green light."',
              whyNot: "<strong>A. Sliding on actin to produce shortening - ❌ INCORRECT</strong><br>This describes actin or the cross-bridge cycle, not tropomyosin. Tropomyosin does not slide; it stays in place on the actin filament and is moved by the troponin complex when Ca2+ binds.<br><br><strong>B. Releasing Ca2+ after initiation of contraction - ❌ INCORRECT</strong><br>Ca2+ is released from the sarcoplasmic reticulum (via ryanodine receptors), not from tropomyosin. Tropomyosin does not store or release Ca2+.<br><br><strong>C. Binding to myosin during contraction - ❌ INCORRECT</strong><br>Tropomyosin binds to actin, not myosin. Myosin binds to actin during contraction. Tropomyosin's role is to prevent actin-myosin binding at rest.<br><br><strong>D. Acting as a 'relaxing protein' at rest by covering up the sites where myosin binds to actin - ✅ CORRECT</strong><br>This is the classic description of tropomyosin's role. It physically covers the myosin-binding sites on actin, preventing cross-bridge formation and keeping the muscle relaxed.<br><br><strong>E. Generating ATP, which it passes to the contractile mechanism - ❌ INCORRECT</strong><br>ATP is generated by mitochondria and glycolysis, not by tropomyosin. The myosin head has ATPase activity and hydrolyzes ATP for the cross-bridge cycle.",

              correct: "B",
              explanation: '<strong>Answer: B — Increased Ca2+ in the sarcoplasm</strong><br><br>Key idea: During relaxation, sarcoplasmic Ca2+ concentration decreases as Ca2+ is actively pumped back into the sarcoplasmic reticulum (SR) via the SERCA pump. Therefore, "increased Ca2+ in the sarcoplasm" is the incorrect statement — it describes the contraction phase.<br><br><strong>Understand the Concept</strong><br><strong>Relaxation Sequence:</strong><br>1. Motor neuron stops firing → no more ACh release.<br>2. ACh is degraded by acetylcholinesterase (AChE) at the synaptic cleft.<br>3. No more endplate potentials → muscle action potentials cease.<br>4. Ca2+ is pumped back into the SR by SERCA (sarco/endoplasmic reticulum Ca2+-ATPase).<br>5. Sarcoplasmic Ca2+ decreases (from ~10^-5 M to ~10^-7 M).<br>6. Ca2+ dissociates from troponin C.<br>7. Tropomyosin covers the myosin-binding sites on actin again.<br>8. Myosin heads are charged with ATP and detached from actin.<br>9. Muscle relaxes.<br><br>Key concept: Relaxation is an active process — it requires ATP to pump Ca2+ back into the SR. The decrease in sarcoplasmic Ca2+ is the trigger for relaxation.<br><br><strong>Common Exam Trap</strong><br>Students often think: "Relaxation is passive; everything just stops."<br>This is incorrect. Relaxation requires energy (ATP) to pump Ca2+ back into the SR. Without ATP, the muscle stays contracted (rigor mortis).<br><br><strong>Exam Takeaway</strong><br>During skeletal muscle relaxation, sarcoplasmic Ca2+ DECREASES as Ca2+ is pumped back into the SR. Increased Ca2+ is a feature of contraction, not relaxation.<br><br><strong>One-line memory rule:</strong><br>"Contraction = Ca2+ up; Relaxation = Ca2+ down (pumped into SR)."',

                { letter: "E", text: "All are answers" },

              correct: "B",
              explanation: '<strong>Answer: B — Myosin</strong><br><br>Key idea: Cross-bridges are formed by the myosin heads (globular heads of the myosin molecule) that extend from the thick filament and bind to actin. The myosin head contains the ATPase activity and the actin-binding site necessary for the cross-bridge cycle.<br><br><strong>Understand the Concept</strong><br><strong>Sarcomere Structure:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>COMPONENT</strong></td><td><strong>DESCRIPTION</strong></td></tr><tr><td>Thick filament</td><td>Composed of myosin molecules. Each myosin has two heads (cross-bridges) and a tail.</td></tr><tr><td>Thin filament</td><td>Composed of actin, tropomyosin, and troponin. Contains myosin-binding sites.</td></tr><tr><td>Cross-bridge</td><td>The myosin head when bound to actin.</td></tr></table><br><strong>Cross-Bridge Cycle:</strong><br>1. Myosin head (charged with ATP) binds to actin → cross-bridge formation.<br>2. Power stroke — myosin head pivots, pulling actin toward the M-line (ADP + Pi released).<br>3. ATP binds to myosin head → cross-bridge detachment.<br>4. ATP is hydrolyzed → myosin head returns to the "cocked" position.<br><br>Key concept: The cross-bridge is myosin, not actin. Actin is the "track" that myosin walks along.<br><br><strong>Exam Takeaway</strong><br>Cross-bridges are made of MYOSIN HEADS. Actin provides the binding sites, but the cross-bridge itself is myosin.<br><br><strong>One-line memory rule:</strong><br>"Myosin = the hook; Actin = the track."',

><br>"Calmodulin = ubiquitous Ca2+ sensor; TnC = muscle Ca2+ sensor — same family."',

            {

              ],
              correct: "B",
              explanation: '<strong>Answer: B — Ca++</strong><br><br>Key idea: Tetanus (tetany) occurs when a skeletal muscle fiber is stimulated at such a high frequency that the Ca2+ released from the SR does not have time to be re-uptaken between stimuli. The intracellular Ca2+ concentration cumulatively increases, and the fiber remains in a state of sustained contraction (fusion of twitches).<br><br><strong>Understand the Concept</strong><br><strong>Tetanus Mechanism:</strong><br>1. Single twitch: A single action potential → brief Ca2+ release → Ca2+ reuptake → muscle relaxes.<br>2. High-frequency stimulation: The next action potential arrives before Ca2+ has been fully pumped back into the SR.<br>3. Intracellular Ca2+ accumulates (summates).<br>4. Myosin-binding sites remain exposed → cross-bridge cycling continues.<br>5. The fiber stays contracted → tetanus.<br><br><strong>Key points:</strong><br>- Tetanus is a physiological state (not pathological tetany caused by hypocalcemia).<br>- The cumulative increase is in Ca2+, not ATP, K+, Na+, or troponin.<br>- ATP is consumed but does not accumulate.<br>- Troponin is the protein that binds Ca2+, but its concentration does not change.<br><br>Key concept: Tetanus is the result of Ca2+ summation — the SR cannot reuptake Ca2+ fast enough, leading to sustained elevated sarcoplasmic Ca2+.<br><br><strong>Exam Takeaway</strong><br>Tetanus results from a cumulative increase in intracellular Ca2+ due to high-frequency stimulation that outpaces SR Ca2+ reuptake.<br><br><strong>One-line memory rule:</strong><br>"Tetanus = too much Ca2+ in the cytosol, too fast."',

              explanation: '<strong>Answer: C — ATP</strong><br><br>Key idea: ATP (adenosine triphosphate) is the direct energy source for muscle contraction. The myosin head hydrolyzes ATP → ADP + Pi to provide the energy for cross-bridge cycling (power stroke and detachment). While creatine phosphate, glucose, and fatty acids are energy sources, they must be converted to ATP to be used by the contractile machinery.<br><br><strong>Understand the Concept</strong><br><strong>Energy Sources for Muscle Contraction:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>ENERGY SOURCE</strong></td><td><strong>ROLE</strong></td><td><strong>DIRECTNESS</strong></td></tr><tr><td>ATP</td><td>Directly powers myosin ATPase for cross-bridge cycling</td><td>Direct (immediate)</td></tr><tr><td>Creatine phosphate</td><td>Rapidly regenerates ATP from ADP (creatine kinase reaction)</td><td>Indirect (recharges ATP)</td></tr><tr><td>Glucose</td><td>Substrate for glycolysis → produces ATP</td><td>Indirect (must be metabolized to ATP)</td></tr><tr><td>Free fatty acids</td><td>Substrate for β-oxidation → produces ATP</td><td>Indirect (must be metabolized to ATP)</td></tr></table><br><strong>The Creatine Phosphate Shuttle:</strong><br>1. ATP is the immediate energy source for contraction.<br>2. When ATP is depleted, creatine phosphate (phosphocreatine) donates its phosphate to ADP: Creatine phosphate + ADP → Creatine + ATP<br>3. This provides a rapid, but short-lived, ATP replenishment.<br><br>Key concept: ATP is the only direct energy source for cross-bridge cycling. All other energy sources (creatine phosphate, glucose, fatty acids) are used to regenerate ATP.<br><br><strong>Exam Takeaway</strong><br>ATP is the DIRECT energy source for muscle contraction. Creatine phosphate, glucose, and fatty acids are INDIRECT sources that regenerate ATP.<br><br><strong>One-line memory rule:</strong><br>"ATP = the cash; all others = the bank."',

              correct: "D",
              explanation: '<strong>Answer: D — Ca++</strong><br><br>Key idea: The arrival of an action potential at the motor neuron axon terminal opens voltage-gated Ca2+ channels. The influx of Ca2+ triggers the fusion of synaptic vesicles containing acetylcholine (ACh) with the presynaptic membrane, releasing ACh into the synaptic cleft via exocytosis.<br><br><strong>Understand the Concept</strong><br><strong>Neuromuscular Junction (NMJ) Transmission Steps:</strong><br>1. Action potential travels down the motor neuron → reaches the axon terminal.<br>2. Depolarization opens voltage-gated Ca2+ channels (P/Q-type) in the presynaptic membrane.<br>3. Ca2+ influx (down its electrochemical gradient) occurs.<br>4. Ca2+ binds to synaptotagmin (a Ca2+ sensor) on synaptic vesicles → triggers SNARE-mediated fusion.<br>5. Acetylcholine (ACh) is released into the synaptic cleft via exocytosis.<br>6. ACh binds to nicotinic ACh receptors on the motor endplate → endplate potential → muscle action potential.<br><br>Key concept: Ca2+ is the trigger for neurotransmitter release at all chemical synapses. Without Ca2+ influx, vesicles cannot fuse with the membrane, and no neurotransmitter is released.<br><br><strong>Exam Takeaway</strong><br>Ca2+ influx at the motor neuron axon terminal triggers ACh release. Na+ drives the action potential, but Ca2+ drives exocytosis.<br><br><strong>One-line memory rule:</strong><br>"Na+ for the spike, Ca2+ for the release."',
              whyNot: "<strong>A. H+ - ❌ INCORRECT</strong><br>H+ (protons) are not involved in neurotransmitter release. Changes in pH can affect channel function, but H+ is not the trigger for exocytosis.<br><br><strong>B. K+ - ❌ INCORRECT</strong><br>K+ efflux is responsible for repolarization and after-hyperpolarization. K+ influx is not the trigger for ACh release. The depolarization phase is driven by Na+ influx, but the trigger for exocytosis is Ca2+.<br><br><strong>C. Na+ - ❌ INCORRECT</strong><br>Na+ influx through voltage-gated Na+ channels is responsible for the upstroke of the action potential (depolarization). However, the specific trigger for vesicle fusion is Ca2+, not Na+.<br><br><strong>D. Ca++ - ✅ CORRECT</strong><br>Ca2+ influx through voltage-gated Ca2+ channels triggers synaptic vesicle exocytosis and ACh release. This is a classic physiology fact.<br><br><strong>E. Cl- - ❌ INCORRECT</strong><br>Cl- influx typically causes inhibition (hyperpolarization) in neurons (e.g., GABA-A receptors). Cl- is not involved in neurotransmitter release at the NMJ.",

              correct: "C",
              explanation: '<strong>Answer: C — Calcium mainly from the sarcoplasmic reticulum</strong><br><br>Key idea: Skeletal muscle contraction is triggered by Ca2+ released primarily from the sarcoplasmic reticulum (SR), specifically the terminal cisternae. This is a key distinction from cardiac and smooth muscle, where extracellular Ca2+ also plays a significant role.<br><br><strong>Understand the Concept</strong><br><strong>Excitation-Contraction Coupling Sequence:</strong><br>1. Action potential → T-tubule depolarization.<br>2. Conformational change in dihydropyridine receptor (DHPR) → mechanically opens ryanodine receptor (RyR1) on the SR.<br>3. Ca2+ is released from the SR into the sarcoplasm.<br>4. Ca2+ binds troponin C → contraction.<br><br>Key concept: Skeletal muscle can contract without extracellular Ca2+ (in vitro) as long as the SR is intact and loaded with Ca2+. This is a major distinction from cardiac muscle.<br><br><strong>Exam Takeaway</strong><br>Skeletal muscle contraction relies on Ca2+ released from the SR (terminal cisternae). ECF Ca2+ is NOT the primary source.<br><br><strong>One-line memory rule:</strong><br>"Skeletal = SR; Cardiac = SR + ECF; Smooth = SR + ECF (variable)."',
              whyNot: "<strong>A. Sodium and potassium - ❌ INCORRECT</strong><br>Na+ and K+ are essential for action potential generation, but they are not directly involved in the chemical events of contraction (cross-bridge cycle). Ca2+ is the trigger ion.<br><br><strong>B. Sodium and magnesium - ❌ INCORRECT</strong><br>Mg2+ is a cofactor for ATPases (including myosin ATPase), but the trigger for contraction is Ca2+. Na+ is not directly involved in the cross-bridge cycle.<br><br><strong>C. Calcium mainly from the sarcoplasmic reticulum - ✅ CORRECT</strong><br>Ca2+ from the SR is the immediate and primary source for skeletal muscle contraction. This is the correct statement.<br><br><strong>D. Calcium mainly from ECF - ❌ INCORRECT</strong><br>In skeletal muscle, ECF Ca2+ is not the primary source. The SR supplies the Ca2+ needed for contraction. ECF Ca2+ is more important in cardiac and smooth muscle.",

              correct: "B",
              explanation: '<strong>Answer: B — Release of calcium from troponin</strong><br><br>Key idea: EC coupling involves a sequence of events from the generation of an endplate potential to cross-bridge cycling. However, Ca2+ is released from the sarcoplasmic reticulum (SR), NOT from troponin. Troponin binds Ca2+ (via TnC) — it does NOT release it. This makes B the correct "exception" answer.<br><br><strong>Understand the Concept</strong><br><strong>Excitation-Contraction Coupling Sequence:</strong><br>1. Generation of endplate potential — ACh binds nicotinic receptors → Na+ influx → depolarization of the motor endplate.<br>2. Muscle action potential — spreads along sarcolemma and down T-tubules.<br>3. Ca2+ release from SR — DHPR (T-tubule) → RyR1 (SR) → Ca2+ released from the SR into sarcoplasm.<br>4. Ca2+ binds troponin C — NOT "release from troponin."<br>5. Tropomyosin moves — exposes myosin-binding sites on actin.<br>6. Cross-linkages (cross-bridges) form between actin and myosin.<br>7. ATP hydrolysis — myosin ATPase hydrolyzes ATP → energy for cross-bridge cycling.<br><br>Key concept: The phrase "release of calcium from troponin" is a distractor because: Ca2+ is stored in and released from the SR. Troponin binds Ca2+ (specifically TnC). It does NOT release Ca2+ — that is the SR\'s job.<br><br><strong>Exam Takeaway</strong><br>EC coupling involves endplate potential → SR Ca2+ release → cross-bridge formation → ATP hydrolysis. Ca2+ is NOT released from troponin - it is released from the SR and BINDS to troponin.<br><br><strong>One-line memory rule:</strong><br>"SR releases Ca2+; troponin receives it."',

            {

              ],
              correct: "A",
              explanation: '<strong>Answer: A — The binding of calcium ions to regulatory proteins on the thin filaments removes the inhibition of actin-myosin interaction</strong><br><br>Key idea: In skeletal muscle, Ca2+ binds to troponin C (a regulatory protein on the thin filament). This removes the inhibition (tropomyosin blockade) of actin-myosin interaction, allowing cross-bridge formation and contraction.<br><br><strong>Understand the Concept</strong><br><strong>Regulation of Skeletal Muscle Contraction:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>STATE</strong></td><td><strong>CA2+ LEVEL</strong></td><td><strong>TROPOMYOSIN POSITION</strong></td><td><strong>ACTIN-MYOSIN INTERACTION</strong></td></tr><tr><td>Rest</td><td>Low</td><td>Covering myosin-binding sites</td><td>Inhibited (blocked)</td></tr><tr><td>Activation</td><td>High (from SR)</td><td>Moved away by troponin</td><td>Removed inhibition → contraction</td></tr></table><br><strong>Mechanism:</strong><br>1. Ca2+ binds to TnC on the thin filament.<br>2. Conformational change → tropomyosin moves.<br>3. Myosin-binding sites on actin are exposed.<br>4. Inhibition is removed → cross-bridges form.<br><br>Key concept: Ca2+ acts as a derepressor — it removes the inhibition of actin-myosin interaction rather than directly activating myosin.<br><br><strong>Exam Takeaway</strong><br>In skeletal muscle, Ca2+ binds to troponin on the THIN FILAMENT, removing tropomyosin inhibition and allowing actin-myosin interaction. It does NOT act on the thick filament.<br><br><strong>One-line memory rule:</strong><br>"Ca2+ takes the brake off (tropomyosin) — it doesn\'t step on the gas (myosin)."',
              whyNot: "<strong>A. The binding of calcium ions to regulatory proteins on the thin filaments removes the inhibition of actin-myosin interaction - ✅ CORRECT</strong><br>This accurately describes the role of Ca2+ in skeletal muscle: binding to troponin (thin filament) removes the inhibitory effect of tropomyosin.<br><br><strong>B. The binding of calcium ions to the thick filament regulatory proteins activates the enzymatic activity of the myosin molecules - ❌ INCORRECT</strong><br>This describes smooth muscle (where Ca2+ binds calmodulin → MLCK → myosin light chain phosphorylation), NOT skeletal muscle. Skeletal muscle regulation is on the thin filament via troponin.<br><br><strong>C. Calcium ions serve as an inhibitor of the interaction of thick and thin filaments - ❌ INCORRECT</strong><br>This is the opposite of the truth. Ca2+ promotes (not inhibits) actin-myosin interaction by removing tropomyosin blockade.<br><br><strong>D. A high concentration of calcium ions in the myofilament space is required to maintain muscle in a contracted state - ❌ INCORRECT</strong><br>While Ca2+ is required to initiate contraction, a high concentration is not required to maintain contraction. The contraction is maintained by cross-bridge cycling, and Ca2+ levels can drop while contraction persists (e.g., latch state in smooth muscle, or tetanus in skeletal muscle).",

              explanation: '<strong>Answer: A — Ca</strong><br><br>Key idea: Calcium (Ca2+) is the ion that links excitation (action potential) with contraction (cross-bridge formation) in all muscle types. This is the definition of excitation-contraction (EC) coupling — the Ca2+ signal translates the electrical signal into a mechanical response.<br><br><strong>Understand the Concept</strong><br><strong>EC Coupling Summary:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>STEP</strong></td><td><strong>EVENT</strong></td></tr><tr><td>1. Excitation</td><td>Action potential → muscle membrane depolarization</td></tr><tr><td>2. Signal transduction</td><td>T-tubule → SR (or ECF → SR) → Ca2+ release</td></tr><tr><td>3. Contraction</td><td>Ca2+ binds to regulatory proteins → cross-bridge cycling</td></tr></table><br><strong>Ca2+ as the "link":</strong><br>- Skeletal muscle: Ca2+ released from SR → binds troponin C.<br>- Cardiac muscle: Ca2+ from SR + ECF → binds troponin C.<br>- Smooth muscle: Ca2+ from SR + ECF → binds calmodulin.<br><br>Without Ca2+, there is no link between electrical excitation and mechanical contraction.<br><br>Key concept: While Na+ and K+ are essential for generating the action potential (excitation), Ca2+ is the specific ion that couples excitation to the contractile machinery.<br><br><strong>Exam Takeaway</strong><br>Ca2+ is the EXCITATION-CONTRACTION COUPLING ION in all muscle types. Na+ and K+ are involved in the action potential, but Ca2+ is the link to contraction.<br><br><strong>One-line memory rule:</strong><br>"Na for the spike, Ca for the strike."',

              whyNot: "<strong>A. ATP hydrolysis - ✅ PART OF EC COUPLING</strong><br>Myosin ATPase hydrolyzes ATP to provide energy for the cross-bridge cycle. This is part of EC coupling (contraction).<br><br><strong>B. Binding of Ca++ to calmodulin - ❌ EXCEPTION (NOT part of skeletal EC coupling)</strong><br>This is the correct answer. Skeletal muscle uses troponin C, NOT calmodulin, as its Ca2+ sensor. Calmodulin is used in smooth muscle.<br><br><strong>C. Conformational change in dihydropyridine receptor - ✅ PART OF EC COUPLING</strong><br>DHPR (L-type Ca2+ channel in T-tubules) undergoes a conformational change upon depolarization, which mechanically opens RyR1 on the SR.<br><br><strong>D. Depolarization of the transverse tubule (T tubule) membrane - ✅ PART OF EC COUPLING</strong><br>The action potential travels down T-tubules to the interior of the muscle fiber, activating DHPR.<br><br><strong>E. Increased Na+ conductance of sarcolemma - ✅ PART OF EC COUPLING</strong><br>Na+ influx through voltage-gated Na+ channels depolarizes the sarcolemma, initiating the action potential that leads to EC coupling.",

              correct: "C",
              explanation: '<strong>Answer: C — A rapid release of calcium from the terminal cisternae of the sarcoplasmic reticulum</strong><br><br>Key idea: The terminal cisternae (lateral sacs) of the sarcoplasmic reticulum (SR) are the major storage sites for Ca2+ in skeletal muscle. Upon excitation, Ca2+ is rapidly released from the terminal cisternae via ryanodine receptors (RyR1) into the sarcoplasm to initiate contraction.<br><br><strong>Understand the Concept</strong><br><strong>SR Structure and Ca2+ Storage:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>SR REGION</strong></td><td><strong>DESCRIPTION</strong></td><td><strong>FUNCTION</strong></td></tr><tr><td>Terminal cisternae</td><td>Expanded sacs adjacent to T-tubules</td><td>Major Ca2+ storage and release site (RyR1)</td></tr><tr><td>Longitudinal tubules</td><td>Network between cisternae</td><td>Ca2+ reuptake via SERCA</td></tr><tr><td>T-tubules</td><td>Invaginations of sarcolemma</td><td>Carry action potentials into the fiber</td></tr></table><br><strong>EC Coupling (Skeletal Muscle):</strong><br>1. Action potential travels down T-tubule.<br>2. DHPR (in T-tubule) undergoes conformational change.<br>3. DHPR mechanically opens RyR1 on the terminal cisternae.<br>4. Ca2+ is released from terminal cisternae → sarcoplasm.<br>5. Ca2+ binds troponin C → contraction.<br><br>Key concept: The terminal cisternae are the immediate source of Ca2+ for skeletal muscle contraction. This is a classic exam distinction.<br><br><strong>Exam Takeaway</strong><br>The IMMEDIATE source of Ca2+ for skeletal muscle contraction is the TERMINAL CISTERNAE of the SARCOPLASMIC RETICULUM.<br><br><strong>One-line memory rule:</strong><br>"SR terminal cisternae = the Ca2+ reservoir for skeletal muscle."',
              whyNot: "<strong>A. Calcium entry through the sarcolemma during the passage of an action potential - ❌ INCORRECT</strong><br>In skeletal muscle, Ca2+ entry through the sarcolemma is minimal and not the primary source for contraction. The bulk of Ca2+ comes from the SR. (This is more relevant to cardiac muscle.)<br><br><strong>B. A rapid release of calcium from its storage sites in the T tubules - ❌ INCORRECT</strong><br>T-tubules do not store Ca2+. They are invaginations of the sarcolemma that carry action potentials. Ca2+ is stored in the SR, specifically the terminal cisternae.<br><br><strong>C. A rapid release of calcium from the terminal cisternae of the sarcoplasmic reticulum - ✅ CORRECT</strong><br>The terminal cisternae of the SR are the immediate source of Ca2+ for skeletal muscle contraction.<br><br><strong>D. A release of calcium bound to cytoplasmic proteins in the region of the myofilaments - ❌ INCORRECT</strong><br>Ca2+ is stored in the SR, not bound to cytoplasmic proteins. While some Ca2+ is buffered by proteins like calsequestrin inside the SR, the immediate source for release is the SR lumen, not cytoplasmic proteins.",

              ],
              correct: "C",
              explanation: '<strong>Answer: C — An outward potassium current</strong><br><br>Key idea: After-hyperpolarization (the undershoot) is caused by a sustained outward K+ current through voltage-gated K+ channels (delayed rectifier K+ channels). These channels are slow to close, so K+ continues to leave the cell even after the membrane potential has returned to resting levels, making the membrane potential temporarily more negative than the resting potential.<br><br><strong>Understand the Concept</strong><br><strong>Action Potential Phases:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>PHASE</strong></td><td><strong>ION MOVEMENT</strong></td><td><strong>MEMBRANE POTENTIAL</strong></td></tr><tr><td>Resting</td><td>Leak K+ channels open</td><td>~ -70 mV</td></tr><tr><td>Depolarization</td><td>Na+ influx (Na+ channels open)</td><td>Moves toward +30 mV</td></tr><tr><td>Repolarization</td><td>Na+ channels inactivate; K+ efflux (K+ channels open)</td><td>Returns toward -70 mV</td></tr><tr><td>After-hyperpolarization</td><td>K+ channels remain open → K+ efflux continues</td><td>More negative than rest (~ -80 to -90 mV)</td></tr></table><br><strong>Key points:</strong><br>- The delayed rectifier K+ channels open during depolarization but are slow to close.<br>- K+ continues to exit the cell, making the membrane potential more negative than the resting potential.<br>- This transient hyperpolarization is called after-hyperpolarization or the undershoot.<br><br>Key concept: After-hyperpolarization is a K+-mediated phenomenon. It is NOT caused by Ca2+, Cl-, or Na+ currents.<br><br><strong>Exam Takeaway</strong><br>After-hyperpolarization (undershoot) is caused by a sustained OUTWARD K+ CURRENT due to delayed closure of voltage-gated K+ channels.<br><br><strong>One-line memory rule:</strong><br>"K+ keeps leaving → membrane overshoots negative."',
              whyNot: "<strong>A. An outward calcium current - ❌ INCORRECT</strong><br>Ca2+ currents are inward (positive charge entering the cell) and contribute to depolarization (e.g., plateau phase in cardiac muscle). They do not cause hyperpolarization.<br><br><strong>B. An inward chloride current - ❌ INCORRECT</strong><br>Cl- currents are typically inward (negative charge entering) and can cause inhibition (hyperpolarization) in some neurons (e.g., GABA-A receptors). However, Cl- is not the cause of after-hyperpolarization in the classic action potential — that is due to K+.<br><br><strong>C. An outward potassium current - ✅ CORRECT</strong><br>Sustained K+ efflux through voltage-gated K+ channels that are slow to close causes the after-hyperpolarization (undershoot).<br><br><strong>D. An outward sodium current - ❌ INCORRECT</strong><br>Na+ currents are inward (Na+ enters the cell) during depolarization. Na+ does not flow outward during an action potential.",

              explanation: '<strong>Answer: C — Plateau phase</strong><br><br>Key idea: The plateau phase of a cardiac action potential is characterized by a balance between inward Ca2+ influx (through L-type Ca2+ channels) and outward K+ efflux (through delayed rectifier K+ channels). This balance maintains the membrane potential near zero for an extended period, creating the plateau.<br><br><strong>Understand the Concept</strong><br><strong>Cardiac Action Potential Phases:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>PHASE</strong></td><td><strong>ION MOVEMENT</strong></td><td><strong>DESCRIPTION</strong></td></tr><tr><td>Phase 0 (Depolarization)</td><td>Na+ influx</td><td>Rapid upstroke</td></tr><tr><td>Phase 1 (Early repolarization)</td><td>K+ efflux</td><td>Transient repolarization</td></tr><tr><td>Phase 2 (Plateau)</td><td>Ca2+ influx = K+ efflux</td><td>Balance → prolonged depolarization</td></tr><tr><td>Phase 3 (Repolarization)</td><td>K+ efflux > Ca2+ influx</td><td>Return to rest</td></tr><tr><td>Phase 4 (Resting)</td><td>Leak K+</td><td>Resting potential</td></tr></table><br><strong>The Plateau Balance:</strong><br>- L-type Ca2+ channels open → Ca2+ enters (inward current).<br>- Delayed rectifier K+ channels open → K+ exits (outward current).<br>- When these currents are balanced, the membrane potential remains relatively stable → plateau.<br><br>Key concept: The plateau phase is unique to cardiac muscle (and some smooth muscle). It is NOT a feature of the skeletal muscle action potential, which does not have a plateau.<br><br><strong>Exam Takeaway</strong><br>The plateau phase is characterized by a balance between inward Ca2+ influx and outward K+ efflux, maintaining a prolonged depolarized state.<br><br><strong>One-line memory rule:</strong><br>"Plateau = Ca2+ in = K out."',
              whyNot: "<strong>A. Polarization - ❌ INCORRECT</strong><br>Polarization refers to the resting state (negative inside). It is not characterized by a balance of Ca2+ influx and K+ efflux.<br><br><strong>B. Depolarization - ❌ INCORRECT</strong><br>Depolarization is driven primarily by Na+ influx (in cardiac phase 0), not a balance of Ca2+ and K+ currents.<br><br><strong>C. Plateau phase - ✅ CORRECT</strong><br>The plateau phase is characterized by a balance between inward Ca2+ and outward K+ currents.<br><br><strong>D. Repolarization - ❌ INCORRECT</strong><br>Repolarization is driven by K+ efflux exceeding Ca2+ influx (phase 3), not a balance.<br><br><strong>E. Hyperpolarization - ❌ INCORRECT</strong><br>Hyperpolarization is caused by sustained K+ efflux (undershoot), not a balance of Ca2+ and K+.<br><br><strong>F. Refractory period - ❌ INCORRECT</strong><br>The refractory period is the time during which a new action potential cannot be generated. It is not defined by ion current balance.",

              explanation: '<strong>Answer: F — Refractory period</strong><br><br>Key idea: The refractory period is the time interval during which a neuron cannot generate another action potential (absolute refractory period) or requires a stronger-than-normal stimulus (relative refractory period). The absolute refractory period corresponds to the time between the opening of the Na+ channel activation gate and the opening of the inactivation gate, during which Na+ channels are inactivated and cannot be re-stimulated.<br><br><strong>Understand the Concept</strong><br><strong>Refractory Period Phases:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>PHASE</strong></td><td><strong>TIME</strong></td><td><strong>MECHANISM</strong></td><td><strong>EXCITABILITY</strong></td></tr><tr><td>Absolute refractory period</td><td>From Na+ channel activation to inactivation gate opening</td><td>Na+ channels are inactivated (cannot reopen)</td><td>No stimulus can generate AP</td></tr><tr><td>Relative refractory period</td><td>After inactivation gate opens, during hyperpolarization</td><td>Some Na+ channels have recovered; K+ channels open</td><td>Stronger stimulus can generate AP</td></tr></table><br><strong>Key points:</strong><br>- The activation gate opens rapidly → Na+ influx → depolarization.<br>- The inactivation gate closes more slowly → Na+ channels become inactivated.<br>- During inactivation, the Na+ channel cannot be opened regardless of the stimulus strength.<br>- This ensures unidirectional propagation of the action potential.<br><br>Key concept: The refractory period is NOT a change in membrane potential - it is a time interval during which the membrane is unresponsive to stimulation. This makes it distinct from polarization, depolarization, repolarization, and hyperpolarization.<br><br><strong>Exam Takeaway</strong><br>The refractory period is the time interval during which Na+ channels are inactivated, preventing another action potential. It ensures unidirectional propagation.<br><br><strong>One-line memory rule:</strong><br>"Refractory = Na+ channels locked - no new AP."',

              explanation: '<strong>Answer: A — Polarization</strong><br><br>Key idea: Polarization refers to the resting state of a cell membrane where there is a separation of charge across the membrane: the inside is negative (due to excess negative charges, mainly from proteins and Cl-) and the outside is positive (due to excess positive charges, mainly Na+). This creates the resting membrane potential (typically -70 to -90 mV).<br><br><strong>Understand the Concept</strong><br><strong>Resting Membrane Potential:</strong><br>The membrane is said to be polarized because there is a charge difference across it. The inside of the cell is negative relative to the outside. This is maintained by:<br>- K+ leak channels → K+ diffuses out → leaves behind negative charges.<br>- Na+/K+-ATPase → pumps 3 Na+ out and 2 K+ in → net negative charge inside.<br>- Impermeant anions (proteins, organic phosphates) inside the cell.<br><br><strong>Key points:</strong><br>- Polarization = the resting state with a charge difference.<br>- Depolarization = reduction in polarization (becomes less negative).<br>- Hyperpolarization = increase in polarization (becomes more negative).<br><br>Key concept: The phrase "negative inside and positive outside" is the textbook definition of polarization (the resting membrane potential state).<br><br><strong>Exam Takeaway</strong><br>Polarization = the resting state with a negative inside and positive outside (separation of charge across the membrane).<br><br><strong>One-line memory rule:</strong><br>"Polarization = negative inside, positive outside (at rest)."',

ndently innervated. Gap junctions are features of cardiac and smooth muscle.<br><br><strong>One-line memory rule:</strong><br>"Skeletal = one fiber, one nerve, no gap junctions; Cardiac = all connected, gap junctions, syncytium."',

tion is scientifically flawed because both skeletal AND cardiac muscle are "exceptions" to the Ca2+-calmodulin pathway. The intended answer (based on exam expectation) is likely skeletal muscle, but the true scientific answer is both skeletal and cardiac.<br><br><strong>Exam Takeaway</strong><br>Textbook answer: Skeletal muscle (A) — it uses troponin C, not calmodulin. However, the scientifically accurate answer would include both skeletal AND cardiac muscle. Be prepared for this inconsistency in exams.<br><br><strong>One-line memory rule:</strong><br>"Smooth = calmodulin; Skeletal & Cardiac = troponin C."',

s): Does NOT require action potentials; activated by neurotransmitters/hormones directly.<br><br>Key concept: The statement "does not require an action potential" is true for multi-unit smooth muscle but false for unitary smooth muscle. The question does not specify, making it ambiguous.<br><br><strong>Exam Takeaway</strong><br>Smooth muscle contraction is Ca2+-dependent, can be long-lasting, and is energy-efficient. Whether it requires an action potential depends on the smooth muscle type (unitary vs. multi-unit). The exam likely intends "does not require an action potential" as the answer.<br><br><strong>One-line memory rule:</strong><br>"Smooth = Ca2+-calmodulin, long, efficient; AP depends on type."',

              explanation: '<strong>Answer: C — Temporary reduction in actin and myosin protein synthesis</strong><br><br>Key idea: Disuse atrophy occurs when a muscle is not used for an extended period (e.g., immobilization in a cast). The primary mechanism is a reduction in protein synthesis (especially actin and myosin) and an increase in protein degradation. Importantly, the number of muscle fibers does not change — the fibers simply shrink (decrease in cross-sectional area).<br><br><strong>Understand the Concept</strong><br><strong>Disuse Atrophy Mechanisms:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>CHANGE</strong></td><td><strong>EFFECT</strong></td></tr><tr><td>↓ Protein synthesis</td><td>Reduced actin/myosin production → smaller myofibrils</td></tr><tr><td>↑ Protein degradation</td><td>Ubiquitin-proteasome pathway → breakdown of contractile proteins</td></tr><tr><td>↓ Fiber cross-sectional area</td><td>Muscle shrinks (atrophy), but fibers are NOT lost</td></tr><tr><td>↓ Mitochondrial content</td><td>Reduced oxidative capacity</td></tr><tr><td>↓ Capillary density</td><td>Reduced blood supply</td></tr></table><br><strong>Key points:</strong><br>- Fiber number is fixed (no hyperplasia in adult muscle) — atrophy is due to fiber size reduction.<br>- The muscle can recover with rehabilitation (exercise → ↑ protein synthesis).<br>- The process is temporary — protein synthesis returns to normal with use.<br><br>Key concept: The question tests the distinction between:<br>- Atrophy = decreased fiber size (reduced protein synthesis)<br>- Hypoplasia = decreased fiber number (not typical in adult muscle)<br>- Denervation = nerve damage → severe atrophy (not the case here)<br><br><strong>Exam Takeaway</strong><br>Disuse atrophy = decreased fiber SIZE (reduced actin/myosin synthesis), NOT decreased fiber number. The muscle shrinks but the fibers remain.<br><br><strong>One-line memory rule:</strong><br>"Atrophy = size down (protein down); number stays same."',

              explanation: '<strong>Answer: C — Fast-glycolytic fibers can generate greater tension than can slow-oxidative fibers</strong><br><br>Key idea: Fast-glycolytic (type IIx/IIb) fibers have a larger cross-sectional diameter and more myofibrils than slow-oxidative (type I) fibers. They generate greater tension (force) per fiber because they have more contractile proteins in parallel. However, they fatigue rapidly due to their reliance on glycolysis.<br><br><strong>Understand the Concept</strong><br><strong>Skeletal Muscle Fiber Types:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>FEATURE</strong></td><td><strong>TYPE I (SLOW-OXIDATIVE)</strong></td><td><strong>TYPE IIA (FAST-OXIDATIVE-GLYCOLYTIC)</strong></td><td><strong>TYPE IIX/IIB (FAST-GLYCOLYTIC)</strong></td></tr><tr><td>Myoglobin</td><td>High (red)</td><td>High</td><td>Low (white)</td></tr><tr><td>Capillaries</td><td>Many</td><td>Many</td><td>Few</td></tr><tr><td>Mitochondria</td><td>Many</td><td>Many</td><td>Few</td></tr><tr><td>Glycogen</td><td>Low</td><td>Moderate</td><td>High</td></tr><tr><td>Fatigue resistance</td><td>High</td><td>Moderate</td><td>Low</td></tr><tr><td>Tension production</td><td>Low</td><td>Moderate</td><td>High</td></tr><tr><td>ATPase speed</td><td>Slow</td><td>Fast</td><td>Fast</td></tr><tr><td>Primary metabolism</td><td>Oxidative</td><td>Oxidative + Glycolytic</td><td>Glycolytic</td></tr></table><br><strong>Why fast-glycolytic fibers generate greater tension:</strong><br>- Larger fiber diameter → more myofibrils in parallel → greater force.<br>- Fast ATPase → rapid cross-bridge cycling.<br>- However, they fatigue quickly due to lactate accumulation and glycogen depletion.<br><br>Key concept: There is a trade-off between force generation and fatigue resistance. Fast-glycolytic fibers are built for power, not endurance.<br><br><strong>Exam Takeaway</strong><br>Fast-glycolytic fibers generate greater tension but fatigue rapidly. Slow-oxidative fibers have more myoglobin, more mitochondria, and greater fatigue resistance.<br><br><strong>One-line memory rule:</strong><br>"Slow = endurance (red); Fast = power (white)."',
              whyNot: "<strong>A. Slow-oxidative fibers have a greater abundance of glycogen than do fast-glycolytic fibers. - ❌ INCORRECT</strong><br>This is backward. Fast-glycolytic fibers have more glycogen (for anaerobic glycolysis), while slow-oxidative fibers have less glycogen (they rely on oxidative metabolism).<br><br><strong>B. Fast-glycolytic fibers have a greater abundance of myoglobin than do slow-oxidative fibers. - ❌ INCORRECT</strong><br>This is backward. Slow-oxidative fibers have more myoglobin (red muscle), while fast-glycolytic fibers have less myoglobin (white muscle).<br><br><strong>C. Fast-glycolytic fibers can generate greater tension than can slow-oxidative fibers - ✅ CORRECT</strong><br>Fast-glycolytic fibers are larger and have more myofibrils, generating greater force per fiber.<br><br><strong>D. Fast-glycolytic fibers are fatigue resistant than slow oxidative fibers - ❌ INCORRECT</strong><br>This is backward. Slow-oxidative fibers are more fatigue-resistant (high mitochondria, oxidative metabolism). Fast-glycolytic fibers fatigue rapidly.",

              correct: "C",
              explanation: '<strong>Answer: C — Elevation of intracellular [Ca2+] for excitation-contraction coupling</strong><br><br>Key idea: All muscle types (skeletal, cardiac, smooth) require a rise in intracellular Ca2+ to activate contraction. This is the fundamental shared feature of excitation-contraction (EC) coupling across all muscle types. The mechanism of Ca2+ release and the target protein differ, but the Ca2+ signal is universal.<br><br><strong>Understand the Concept</strong><br><strong>Shared Features and Differences:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>FEATURE</strong></td><td><strong>SKELETAL MUSCLE</strong></td><td><strong>SMOOTH MUSCLE</strong></td><td><strong>SHARED?</strong></td></tr><tr><td>Ca2+ required for EC coupling</td><td>YES (binds TnC)</td><td>YES (binds calmodulin)</td><td>YES (shared)</td></tr><tr><td>Sarcomeres</td><td>YES</td><td>NO</td><td>NO</td></tr><tr><td>Troponin</td><td>YES</td><td>NO</td><td>NO</td></tr><tr><td>Spontaneous depolarization</td><td>NO</td><td>YES (some types)</td><td>NO</td></tr><tr><td>Gap junctions</td><td>NO</td><td>YES (some types)</td><td>NO</td></tr></table><br><strong>Why Ca2+ is the universal signal:</strong><br>- Skeletal: Ca2+ binds troponin C → moves tropomyosin → exposes myosin-binding sites.<br>- Smooth: Ca2+ binds calmodulin → activates MLCK → phosphorylates myosin light chain.<br>- Cardiac: Ca2+ binds troponin C (similar to skeletal, with CICR).<br><br>Key concept: The rise in intracellular Ca2+ is the common trigger for contraction in all muscle types. The molecular pathway downstream of Ca2+ differs, but the initial signal is the same.<br><br><strong>Exam Takeaway</strong><br>The universal feature of all muscle types is that contraction is triggered by a rise in intracellular Ca2+. The downstream target (troponin C vs. calmodulin) differs, but the Ca2+ signal is shared.<br><br><strong>One-line memory rule:</strong><br>"All muscles need Ca2+; they just read the signal differently."',

                '<strong>Answer: A — Number of muscle fibers that contract simultaneously</strong><br><br>⚡ <strong>Key idea:</strong> <em>The overall force a whole muscle produces is graded mainly by recruitment — how many motor units (and therefore how many muscle fibers) are activated at the same time. This is one of the two classic mechanisms of force grading in skeletal muscle, the other being the frequency of stimulation (temporal summation).</em><br><br>🧠 <strong>Understand the Concept — Two ways the nervous system grades whole-muscle force:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>MECHANISM</strong></td><td><strong>HOW IT WORKS</strong></td></tr><tr><td>Spatial summation (recruitment)</td><td>More motor units → more fibers activated → more total force</td></tr><tr><td>Temporal summation (frequency)</td><td>Faster firing rate on an already-active fiber → twitches fuse → more force per fiber (up to tetanus)</td></tr></table><br><strong>The size principle of recruitment:</strong><br><br>1. Small, fatigue-resistant motor units (slow-oxidative) are recruited first for fine, low-force tasks.<br>2. As more force is needed, progressively larger motor units (fast-glycolytic) are recruited.<br>3. At maximum voluntary effort, essentially all motor units in the muscle are active simultaneously.<br><br>Key concept: The question asks about the force of the entire muscle, not a single fiber. A single fiber\'s contraction is roughly all-or-none once threshold is reached, but the whole muscle\'s force is a sum of how many fibers are pulling together — that is recruitment.<br><br>🎓 <strong>Exam Takeaway:</strong> Whole-muscle force is graded mainly by RECRUITMENT (how many fibers/motor units fire together) and by stimulation FREQUENCY. Recruitment is the classic "textbook" answer for this style of question.<br><br>🧠 <strong>One-line memory rule:</strong> "More fibers firing together = more muscle force."',

              q: "Myasthenia gravis is due to:",

              explanation:
                '<strong>Answer: D — Destruction of ACh receptors</strong><br><br>⚡ <strong>Key idea:</strong> <em>Myasthenia gravis (MG) is an autoimmune disease in which the body produces antibodies against the nicotinic acetylcholine receptors (AChR) on the postsynaptic membrane of the neuromuscular junction. With fewer functional receptors available, neuromuscular transmission becomes progressively less reliable, especially with repeated use — producing the classic fatigable weakness of MG.</em><br><br>🧠 <strong>Understand the Concept — What actually goes wrong in MG:</strong><br><br>1. Autoantibodies (usually IgG) target postsynaptic nicotinic AChR at the motor endplate.<br>2. Antibody binding causes receptor internalization/degradation, complement-mediated membrane damage, and blockade of the ACh binding site.<br>3. Fewer functional receptors → smaller endplate potentials → many endplate potentials fail to reach threshold, especially with repetitive firing.<br>4. Clinically: fatigable weakness that worsens with sustained activity and improves with rest — classically affecting eye and facial muscles first (ptosis, diplopia).<br><br><strong>Contrast with Lambert-Eaton myasthenic syndrome (LEMS):</strong> LEMS is the opposite mechanism — antibodies against presynaptic voltage-gated Ca²⁺ channels, reducing ACh release. Weakness in LEMS classically improves with repeated activity, unlike MG.<br><br>Key concept: MG is a postsynaptic, receptor-level autoimmune disease — the nerve still releases ACh normally, but the muscle side cannot "hear" the signal properly because its receptors are being destroyed.<br><br>🎓 <strong>Exam Takeaway:</strong> Myasthenia gravis = autoantibodies destroy postsynaptic ACh receptors at the neuromuscular junction, causing fatigable muscle weakness.<br><br>🧠 <strong>One-line memory rule:</strong> "MG = Muscle\'s receptors Gone (autoimmune); LEMS = Less ACh released (presynaptic)."',
              whyNot:
