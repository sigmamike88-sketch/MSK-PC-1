                '<strong>Answer: C — Motor neuron and muscle fibers supplied by it</strong><br><br>⚡ <strong>Key idea:</strong> <em>A motor unit is defined as one alpha motor neuron together with every muscle fiber it innervates. A single motor neuron\'s axon branches to contact many muscle fibers (not just one), and all of those fibers contract together whenever that neuron fires — this all-or-none group is the functional unit of muscle control.</em><br><br>🧠 <strong>Understand the Concept — Key facts about motor units:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>FEATURE</strong></td><td><strong>DETAIL</strong></td></tr><tr><td>Composition</td><td>1 motor neuron + all the muscle fibers it innervates (can range from a handful to over a thousand fibers)</td></tr><tr><td>Fiber type uniformity</td><td>All fibers within one motor unit are the same fiber type</td></tr><tr><td>Innervation ratio</td><td>Small (fine-control muscles, e.g. eye muscles) = few fibers per neuron; Large (gross-power muscles) = many fibers per neuron</td></tr><tr><td>Activation</td><td>All-or-none — when the motor neuron fires, every fiber in that unit contracts</td></tr></table><br><strong>Why this matters for force grading:</strong><br><br>Recruiting more motor units increases whole-muscle force — this is the same "recruitment" principle tested in Q1 above. The motor unit is the basic building block of that mechanism.<br><br>Key concept: Don\'t confuse the motor unit with a single neuromuscular junction (one synapse on one fiber) — the motor unit is the entire population of fibers controlled by one neuron.<br><br>🎓 <strong>Exam Takeaway:</strong> A motor unit = one motor neuron + all the muscle fibers it innervates (often many, not just one). All fibers in a unit share the same fiber type and fire together.<br><br>🧠 <strong>One-line memory rule:</strong> "One neuron, many fibers, one team."',

            {

              explanation:
                '<strong>Answer: C — Z lines approach each other</strong><br><br>⚡ <strong>Key idea:</strong> <em>In an isotonic contraction, the muscle actually shortens (unlike an isometric contraction, where length stays fixed). As the sarcomere shortens, the thin filaments slide further over the thick filaments, pulling the Z lines closer together. This is the direct visual hallmark of shortening under the sliding filament model.</em><br><br>🧠 <strong>Understand the Concept — What changes and what doesn\'t, as a sarcomere shortens:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>BAND/ZONE</strong></td><td><strong>WHAT IT REPRESENTS</strong></td><td><strong>CHANGES DURING SHORTENING?</strong></td></tr><tr><td>A band</td><td>Length of the thick (myosin) filament</td><td>No – constant</td></tr><tr><td>I band</td><td>Region containing only thin filament</td><td>Yes – shortens</td></tr><tr><td>H zone</td><td>Region containing only thick filament (center of A band)</td><td>Yes – shortens</td></tr><tr><td>Z line ↔ Z line distance (sarcomere length)</td><td>Boundary of one sarcomere</td><td>Yes – shortens (Z lines move closer)</td></tr></table><br>Key concept: The A band never changes because it is defined by the fixed length of the myosin (thick) filament itself — filaments don\'t get shorter, they just overlap more. Everything that reflects overlap (I band, H zone, and the Z-to-Z distance) shrinks as the muscle shortens.<br><br>🎓 <strong>Exam Takeaway:</strong> During shortening, the Z lines move closer, and the I band and H zone both shrink. The A band alone stays constant because it reflects fixed thick-filament length.<br><br>🧠 <strong>One-line memory rule:</strong> "A band = Always the same; everything else shrinks as the sarcomere shortens."',
              whyNot:

              explanation:
                '<strong>Answer: A — Mainly actin</strong><br><br>⚡ <strong>Key idea:</strong> <em>The I band is, by definition, the region of the sarcomere that contains only thin filament (actin, with its associated tropomyosin and troponin), with no myosin overlap. Since it\'s dominated by the thin filament, actin is the main structural protein present there.</em><br><br>🧠 <strong>Understand the Concept — Sarcomere zones and their protein content:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>ZONE</strong></td><td><strong>FILAMENT CONTENT</strong></td><td><strong>DOMINANT PROTEIN</strong></td></tr><tr><td>A band</td><td>Thick filament (with or without thin filament overlap)</td><td>Myosin</td></tr><tr><td>H zone (center of A band)</td><td>Thick filament only, no overlap</td><td>Myosin</td></tr><tr><td>I band</td><td>Thin filament only, no myosin overlap</td><td>Actin (thin filament core, plus tropomyosin/troponin)</td></tr></table><br><strong>Why the wording matters:</strong><br><br>- Tropomyosin and troponin are present on the thin filament too, but they are minor regulatory components compared to the sheer bulk of the actin polymer that makes up the thin filament backbone.<br>- "Mainly actin" is the standard textbook phrasing for I-band composition; myosin is entirely absent from the I band by definition.<br><br>Key concept: If you remember "I for thin filament only," you\'ll never confuse I band with A band again — A band always contains myosin, I band never does.<br><br>🎓 <strong>Exam Takeaway:</strong> The I band = thin filament only = mainly ACTIN. The A band = thick filament (myosin), with or without overlap.<br><br>🧠 <strong>One-line memory rule:</strong> "I band = actin only."',
              whyNot:

                '<strong>Answer: B — H zone</strong><br><br>⚡ <strong>Key idea:</strong> <em>The H zone is the central region of the A band where only thick (myosin) filament is present, with no thin filament overlap. As the muscle contracts and thin filaments slide further toward the center of the sarcomere, they progressively invade and eventually eliminate the H zone at maximal contraction.</em><br><br>🧠 <strong>Understand the Concept — What happens to each zone as contraction proceeds toward maximal shortening:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>ZONE</strong></td><td><strong>AT REST</strong></td><td><strong>AT FULL CONTRACTION</strong></td></tr><tr><td>A band</td><td>Full length of thick filament</td><td>Unchanged</td></tr><tr><td>I band</td><td>Visible gap of thin-filament-only region</td><td>Shrinks, and can nearly vanish</td></tr><tr><td>H zone</td><td>Visible gap of thick-filament-only region</td><td>Disappears</td></tr><tr><td>M line</td><td>Midline of the sarcomere</td><td>Remains — a structural landmark, not a filament-overlap zone</td></tr></table><br><strong>Why the H zone specifically disappears:</strong><br><br>As actin filaments slide toward the M line from both ends, they cover more and more of the previously "myosin-only" central zone. At sufficient shortening, thin filaments from opposite sides can even meet or overlap each other at the M line, completely erasing the H zone.<br><br>Key concept: The I band also shrinks with contraction but, unlike the H zone, doesn\'t fully disappear until extreme (often non-physiological) shortening. The H zone is the classic "disappears on contraction" answer in most physiology courses.<br><br>🎓 <strong>Exam Takeaway:</strong> The H zone (myosin-only central region) disappears as thin filaments slide inward and overlap the entire thick filament during contraction. The A band never changes.<br><br>🧠 <strong>One-line memory rule:</strong> "H zone Hides away as the muscle contracts."',

            {

              ],
              correct: "B",
              explanation:
                '<strong>Answer: B — Myosin</strong><br><br>⚡ <strong>Key idea:</strong> <em>Cross-bridges are the myosin heads that extend from the thick filament and physically attach to actin during the contraction cycle. Actin provides the binding site, but the structure that reaches out, attaches, pivots (power stroke), and detaches — i.e., the cross-bridge itself — is myosin.</em><br><br>🧠 <strong>Understand the Concept — Roles of the key sarcomere proteins:</strong><br><br><table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;"><tr><td><strong>PROTEIN</strong></td><td><strong>LOCATION</strong></td><td><strong>ROLE</strong></td></tr><tr><td>Myosin</td><td>Thick filament</td><td>Forms the cross-bridge (globular head); has ATPase activity; generates the power stroke</td></tr><tr><td>Actin</td><td>Thin filament</td><td>Provides the binding site for myosin heads</td></tr><tr><td>Troponin</td><td>Thin filament (with tropomyosin)</td><td>Ca²⁺ sensor; regulates whether binding sites are exposed</td></tr><tr><td>Tropomyosin</td><td>Thin filament</td><td>Physically blocks/exposes the myosin-binding sites on actin</td></tr></table><br><strong>The cross-bridge cycle (myosin\'s job):</strong><br><br>1. Myosin head (charged with ATP) binds exposed site on actin → cross-bridge forms.<br>2. Power stroke: myosin head pivots, pulling actin toward the center of the sarcomere; ADP + Pi released.<br>3. New ATP binds myosin head → cross-bridge detaches.<br>4. ATP hydrolysis re-cocks the myosin head for the next cycle.<br><br>Key concept: "Cross-bridge" is essentially a synonym for the attached myosin head. If a question asks what physically links the thick and thin filaments, the answer is always myosin.<br><br>🎓 <strong>Exam Takeaway:</strong> Cross-bridges are formed by MYOSIN heads. Actin provides the track/binding site; troponin and tropomyosin are regulatory, not structural, components of the cross-bridge.<br><br>🧠 <strong>One-line memory rule:</strong> "Myosin reaches out and grabs — that grab IS the cross-bridge."',

yosin overlap — and therefore cross-bridge number — is greatest.<br><br>🧠 <strong>One-line memory rule:</strong> "Best overlap = best force = best speed."',

              <button class="icon-btn" id="backBtn" title="Back" style="margin-right:4px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
              </button>
              <div class="logo-badge" style="background:linear-gradient(135deg, ${style.color}, ${style.color2});">${style.icon}</div>
              <div>
                <div class="logo-text">${escapeHtml(title)}</div>
                <div class="logo-sub">${exams.length} ${exams.length === 1 ? "exam" : "exams"} available</div>
              </div>
            </div>
            <div class="avatar">AL</div>
          </header>

          <div class="crumbs">
            <span class="crumb link" data-crumb="home">Alifo</span>
            <span class="crumb-sep">›</span>
            ${
              subtopic
                ? `<span class="crumb link" data-crumb="subject">${escapeHtml(subject)}</span>
                   <span class="crumb-sep">›</span>
                   <span class="crumb current">${escapeHtml(subtopic)}</span>`
                : `<span class="crumb current">${escapeHtml(subject)}</span>`
            }
          </div>

          <div class="section-title">
            PAST YEAR EXAMS
            <span class="count">${exams.length}</span>
          </div>

          <div class="list">
            ${
              exams.length === 0
                ? `<div class="empty-state">
                   <span class="emoji">📭</span>
                   <div class="title">No exams yet</div>
                   <div class="desc">Add exams in the QUIZ_DATA section.</div>
                 </div>`
                : exams.map((e) => renderExamCard(e, style)).join("")
            }
          </div>
        `;

        bindExamEvents();
      }

      function renderExamCard(exam, style) {
        const p = getExamProgress(exam);
        const pct = p.total ? Math.round((p.answered / p.total) * 100) : 0;
        let status = "new",
          statusLabel = "New";
        if (p.answered === p.total && p.total > 0) {
          status = "done";
          statusLabel = "Completed";
        } else if (p.answered > 0) {
          status = "progress";
          statusLabel = "In Progress";
        }

        return `
          <div style="position:relative;">
          <button class="course-card"
                  data-exam="${exam.id}"
                  style="--course-color:${style.color};--course-color-2:${style.color2};--course-bg:${style.bg};--course-border:${style.border};">
            <div class="course-thumb" style="background:${style.bg};border-color:${style.border};font-family:ui-monospace,monospace;font-size:14px;font-weight:800;color:${style.color};">
              ${exam.year}
            </div>
            <div class="course-body">
              <div class="course-title">${escapeHtml(exam.title)}</div>
              <div class="course-meta">
                ${
                  p.answered > 0
                    ? `${p.answered}/${p.total} answered · ${p.correct} correct`
                    : `${p.total} question${p.total === 1 ? "" : "s"}`
                }
              </div>
              ${p.answered > 0 ? `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>` : ""}
            </div>
            <span class="year-status ${status}" style="font-size:10px;font-weight:800;letter-spacing:0.8px;padding:4px 9px;border-radius:7px;text-transform:uppercase;flex-shrink:0;${status === "done" ? "color:var(--green);background:var(--green-bg);" : status === "progress" ? "color:var(--yellow);background:rgba(245,184,0,0.14);" : "color:var(--blue);background:rgba(77,159,255,0.14);"}">${statusLabel}</span>
          </button>
          ${
            p.answered > 0
              ? `
            <button class="reset-exam-btn" data-reset-exam="${exam.id}" title="Reset this exam"
              style="position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:9px;
                     background:rgba(231,76,60,0.12);border:1px solid rgba(231,76,60,0.35);
                     color:#e74c3c;display:grid;place-items:center;z-index:2;
                     transition:all 0.2s;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                <path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
              </svg>
            </button>
          `
              : ""
          }
        </div>
        `;
      }

      function bindExamEvents() {
        document.getElementById("backBtn").addEventListener("click", () => {
          if (state.subtopic) {
            state.view = "subtopics";
            state.subtopic = null;
          } else {
            state.view = "courses";
            state.course = null;
          }
          render();
          window.scrollTo(0, 0);
        });
        document.querySelectorAll("[data-crumb]").forEach((el) => {
          el.addEventListener("click", () => {
            const target = el.dataset.crumb;
            if (target === "home") {
              state.view = "courses";
              state.course = null;
              state.subtopic = null;
            } else if (target === "subject") {
              state.view = "subtopics";
              state.subtopic = null;
            }
            render();
            window.scrollTo(0, 0);
          });
        });
        document.querySelectorAll("[data-reset-exam]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const examId = btn.dataset.resetExam;
            const exam = QUIZ_DATA.find((ex) => ex.id === examId);
            if (!exam) return;
            const p = state.progress[examId] || {};
            const answered = Object.keys(p).length;
            if (answered === 0) return;
            if (
              !confirm(
                `Reset progress for "${exam.title}"?\n\nThis will clear ${answered} answered question${answered === 1 ? "" : "s"} for this exam only.`,
              )
            )
              return;
            delete state.progress[examId];
            saveProgress();
            showToast("✓ Exam progress reset");
            render();
          });
        });

        document.querySelectorAll("[data-exam]").forEach((el) => {
          el.addEventListener("click", () => {
            const exam = QUIZ_DATA.find((e) => e.id === el.dataset.exam);
            if (!exam) return;
            state.exam = exam;
            const p = state.progress[exam.id] || {};
            const answered = Object.keys(p)
              .map(Number)
              .sort((a, b) => a - b);
            state.qIndex =
              answered.length > 0 ? answered[answered.length - 1] : 0;
            state.showExplanation = false;
            state.showWhyNot = false;
            state.streak = 0;
            state.startTime = Date.now();
            state.view = "quiz";
            render();
            window.scrollTo(0, 0);
          });
        });
      }

      /* ================= QUIZ ================= */
      function renderQuiz() {
        const exam = state.exam;
        const q = exam.questions[state.qIndex];
        const progress = state.progress[exam.id] || {};
        const savedAnswer = progress[state.qIndex];
        const answered = !!savedAnswer;
        const isCorrect = answered && savedAnswer.correct;
        const pct = Math.round(
          ((state.qIndex + 1) / exam.questions.length) * 100,
        );

        const optionsHTML = q.options
          .map((opt) => {
            let cls = "option";
            if (answered) {
              cls += " locked";
              if (opt.letter === q.correct) cls += " correct";
              else if (opt.letter === savedAnswer.chosen) cls += " wrong";
            }
            return `
              <button class="${cls}" data-letter="${opt.letter}">
                <span class="letter">${opt.letter}</span>
                <span>${escapeHtml(opt.text)}</span>
              </button>
            `;
          })
          .join("");

        const qNavHTML = exam.questions
          .map((_, i) => {
            const p = progress[i];
            let cls = "q-nav-btn";
            if (i === state.qIndex) cls += " current";
            else if (p)
              cls += p.correct ? " answered-correct" : " answered-wrong";
            return `<button class="${cls}" data-qnav="${i}">${i + 1}</button>`;
          })
          .join("");

        const allAnswered =
          Object.keys(progress).length === exam.questions.length;

        app.innerHTML = `
          <div class="quiz-header">
            <button class="icon-btn" id="backBtn" title="Back">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
              </svg>
            </button>
            <div class="quiz-header-info">
              <div class="quiz-header-title">${escapeHtml(exam.title)}</div>
              <div class="quiz-header-count">Q${state.qIndex + 1} of ${exam.questions.length}</div>
            </div>
            <button class="icon-btn" id="closeBtn" title="Close">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M18 6L6 18M6 6l12 12"/>
              </svg>
            </button>
          </div>
          <div class="quiz-progress"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>

          <div class="quiz-body">
            <div class="plate-rail">
              <span class="plate-dot"></span>
              <div class="plate-label">${escapeHtml(exam.subject.toUpperCase())} · PASTYEAR QUIZ</div>
              <div class="plate-title">${escapeHtml(exam.title)}</div>
              <div class="plate-section">${escapeHtml(exam.section || "")}</div>
            </div>

            ${q.section ? `<div class="q-plate-tag">${escapeHtml(q.section)}</div>` : ""}
            <div class="q-tag-row">
              <div class="q-tag-left">
                <span class="q-number">Q${state.qIndex + 1}</span>
                <span class="q-topic">${escapeHtml(exam.topic)}</span>
              </div>
              <div class="q-meta-badges">
                ${state.streak > 1 ? `<span class="meta-badge streak">🔥 ${state.streak} streak</span>` : ""}
              </div>
            </div>

            <div class="q-text">${escapeHtml(q.q)}</div>
            <div class="options">${optionsHTML}</div>

                        ${
                          answered
                            ? `
              <div class="result-row ${isCorrect ? "correct" : "wrong"}">
                ${isCorrect ? "✓ Correct" : "✗ Incorrect — correct answer is " + q.correct}
              </div>
              <div class="action-btns">
                <button class="action-btn ${state.showExplanation ? "active" : ""}" id="explBtn">
                  ${state.showExplanation ? "Hide Explanation" : "Explanation"}
                </button>
                <button class="action-btn ${state.showWhyNot ? "active" : ""}" id="whyNotBtn">
                  ${state.showWhyNot ? "Hide Why Not" : "Why not the others"}
                </button>
              </div>
              ${
                state.showExplanation
                  ? `<div class="explanation">
                     <div class="explanation-label">Explanation</div>
                     <div class="explanation-text">${q.explanation || "No explanation provided."}</div>
                   </div>`
                  : ""
              }
              ${
                state.showWhyNot
                  ? `<div class="explanation why-not">
                     <div class="explanation-label">Why not the others</div>
                     <div class="explanation-text">${q.whyNot || "No details provided for the other options."}</div>
                   </div>`
                  : ""
              }
            `
                            : ""
                        }

            <div class="q-nav">${qNavHTML}</div>

            <div class="nav-buttons">
              <button class="nav-btn" id="prevBtn" ${state.qIndex === 0 ? "disabled" : ""}>← Previous</button>
              ${
                state.qIndex === exam.questions.length - 1
                  ? `<button class="nav-btn primary" id="finishBtn">${allAnswered ? "See Results →" : "Next →"}</button>`
                  : `<button class="nav-btn primary" id="nextBtn">Next →</button>`
              }
            </div>
          </div>
        `;

        bindQuizEvents();
      }

      function bindQuizEvents() {
        const exam = state.exam;

        document
          .getElementById("backBtn")
          .addEventListener("click", goBackToExams);
        document
          .getElementById("closeBtn")
          .addEventListener("click", goBackToExams);

        const progress = state.progress[exam.id] || {};
        const answered = !!progress[state.qIndex];

        if (!answered) {
          document.querySelectorAll(".option").forEach((opt) => {
            opt.addEventListener("click", () => pickAnswer(opt.dataset.letter));
          });
        }

        const explBtn = document.getElementById("explBtn");
        if (explBtn) {
          explBtn.addEventListener("click", () => {
            state.showExplanation = !state.showExplanation;
            renderQuiz();
          });
        }
        const whyNotBtn = document.getElementById("whyNotBtn");
        if (whyNotBtn) {
          whyNotBtn.addEventListener("click", () => {
            state.showWhyNot = !state.showWhyNot;
            renderQuiz();
          });
        }

        document.querySelectorAll("[data-qnav]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.qIndex = parseInt(btn.dataset.qnav);
            state.showExplanation = false;
            state.showWhyNot = false;
            renderQuiz();
            window.scrollTo(0, 0);
          });
        });

        const prev = document.getElementById("prevBtn");
        const next = document.getElementById("nextBtn");
        const finish = document.getElementById("finishBtn");
        if (prev)
          prev.addEventListener("click", () => {
            if (state.qIndex > 0) {
              state.qIndex--;
              state.showExplanation = false;
              state.showWhyNot = false;
              renderQuiz();
              window.scrollTo(0, 0);
            }
          });
        if (next)
          next.addEventListener("click", () => {
            if (state.qIndex < exam.questions.length - 1) {
              state.qIndex++;
              state.showExplanation = false;
              state.showWhyNot = false;
              renderQuiz();
              window.scrollTo(0, 0);
            }
          });
        if (finish)
          finish.addEventListener("click", () => {
            state.view = "finish";
            render();
            window.scrollTo(0, 0);
          });
      }

      function pickAnswer(chosen) {
        const exam = state.exam;
        const q = exam.questions[state.qIndex];
        if (!state.progress[exam.id]) state.progress[exam.id] = {};
        const wasCorrect = chosen === q.correct;
        state.progress[exam.id][state.qIndex] = {
          chosen,
          correct: wasCorrect,
          t: Date.now(),
        };
        saveProgress();
        if (wasCorrect) {
          state.streak = (state.streak || 0) + 1;
          if (state.streak >= 3)
            showToast(`🔥 ${state.streak} correct in a row!`);
        } else {
          state.streak = 0;
        }
        state.showExplanation = false;
        state.showWhyNot = false;
        renderQuiz();
        setTimeout(() => {
          const r = document.querySelector(".result-row");
          if (r) r.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }, 50);
      }

      function goBackToExams() {
        state.view = "exams";
        state.exam = null;
        render();
        window.scrollTo(0, 0);
      }

      /* ================= FINISH ================= */
      function renderFinish() {
        const exam = state.exam;
        const p = getExamProgress(exam);
        const pct = p.total ? Math.round((p.correct / p.total) * 100) : 0;
        const elapsed = state.startTime
          ? Math.round((Date.now() - state.startTime) / 1000)
          : 0;
        const mins = Math.floor(elapsed / 60);
        const secs = elapsed % 60;

        let emoji = "🎉",
          title = "Great job!",
          sub = "You finished the exam.";
        if (pct === 100) {
          emoji = "🏆";
          title = "Perfect score!";
          sub = "You aced every question.";
        } else if (pct >= 80) {
          emoji = "🌟";
          title = "Excellent!";
          sub = "You're well prepared.";
        } else if (pct >= 60) {
          emoji = "👍";
          title = "Good work!";
          sub = "Keep practicing to improve.";
        } else if (pct >= 40) {
          emoji = "📖";
          title = "Keep going!";
          sub = "Review the explanations and try again.";
        } else {
          emoji = "💪";
          title = "Don't give up!";
          sub = "Practice makes perfect.";
        }

        app.innerHTML = `
          <header class="topbar">
            <div class="logo-wrap">
              <div class="logo-badge">📘</div>
              <div>
                <div class="logo-text">Results</div>
                <div class="logo-sub">${escapeHtml(exam.title)}</div>
              </div>
            </div>
            <div class="avatar">AL</div>
          </header>

          <div class="finish-card">
            <span class="finish-emoji">${emoji}</span>
            <div class="finish-title">${title}</div>
            <div class="finish-sub">${sub}</div>
            <div class="finish-score">${pct}%</div>
            <div class="finish-score-label">${p.correct} of ${p.total} correct · ${mins}m ${secs}s</div>
            <div class="finish-btns">
              <button class="nav-btn" id="reviewBtn" style="flex:0;padding:14px 22px;">Review</button>
              <button class="nav-btn" id="backToExamsBtn" style="flex:0;padding:14px 22px;">Back</button>
              <button class="nav-btn primary" id="retryBtn" style="flex:0;padding:14px 22px;">Retry</button>
            </div>
          </div>
        `;

        document.getElementById("reviewBtn").addEventListener("click", () => {
          state.qIndex = 0;
          state.showExplanation = false;
          state.showWhyNot = false;
          state.view = "quiz";
          render();
          window.scrollTo(0, 0);
        });
        document
          .getElementById("backToExamsBtn")
          .addEventListener("click", () => {
            state.view = "exams";
            state.exam = null;
            render();
            window.scrollTo(0, 0);
          });
        document.getElementById("retryBtn").addEventListener("click", () => {
          if (!confirm("Clear your answers for this exam and start over?"))
            return;
          delete state.progress[exam.id];
          saveProgress();
          state.qIndex = 0;
          state.showExplanation = false;
          state.showWhyNot = false;
          state.streak = 0;
          state.startTime = Date.now();
          state.view = "quiz";
          render();
          window.scrollTo(0, 0);
        });
      }

      /* =====================================================================
                       KEYBOARD SHORTCUTS
                       ===================================================================== */
      document.addEventListener("keydown", (e) => {
        if (state.view === "quiz") {
          if (
            ["1", "2", "3", "4", "5", "a", "b", "c", "d", "e"].includes(
              e.key.toLowerCase(),
            )
          ) {
            const map = {
              1: "A",
              2: "B",
              3: "C",
              4: "D",
              5: "E",
              a: "A",
              b: "B",
              c: "C",
              d: "D",
              e: "E",
            };
            const letter = map[e.key.toLowerCase()];
            const opt = document.querySelector(
              `.option[data-letter="${letter}"]:not(.locked)`,
            );
            if (opt) opt.click();
          } else if (e.key === "ArrowRight") {
            const n = document.getElementById("nextBtn");
            if (n) n.click();
          } else if (e.key === "ArrowLeft") {
            const p = document.getElementById("prevBtn");
            if (p && !p.disabled) p.click();
          } else if (e.key === "Escape") {
            goBackToExams();
          }
        }
      });

      /* =====================================================================
                       THEME TOGGLE
                       ===================================================================== */
      const THEME_KEY = "alifo_theme_v1";

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        try {
          localStorage.setItem(THEME_KEY, theme);
        } catch {}
        updateThemeIcon(theme);
      }

      function updateThemeIcon(theme) {
        const icon = document.getElementById("themeIcon");
        if (!icon) return;
        if (theme === "light") {
          icon.innerHTML = `
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          `;
        } else {
          icon.innerHTML = `
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          `;
        }
      }

      function initTheme() {
        let saved = "dark";
        try {
          saved = localStorage.getItem(THEME_KEY) || "dark";
        } catch {}
        applyTheme(saved);
      }

      function bindThemeToggle() {
        const btn = document.getElementById("themeToggle");
        if (!btn) return;
        btn.addEventListener("click", () => {
          const current =
            document.documentElement.getAttribute("data-theme") || "dark";
          applyTheme(current === "dark" ? "light" : "dark");
        });
      }

      /* =====================================================================
                       BOOT
                       ===================================================================== */
      initTheme();
      render();
      bindThemeToggle();
    </script>
  </body>
</html>
