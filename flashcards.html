<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSK Flashcards</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦴</text></svg>"
    />
    <style>
      :root {
        --bg: #0a0e14;
        --card: #121821;
        --border: #1f2836;
        --border-2: #2b3648;
        --text: #e6edf3;
        --text-dim: #8b949e;
        --text-faint: #5a6472;
        --accent: #4dd0e1;
        --accent-2: #4d9fff;
        --blue: #4d9fff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }
      .header {
        width: 100%;
        max-width: 600px;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background: rgba(77, 208, 225, 0.08);
        border: 1px solid rgba(77, 208, 225, 0.25);
        border-radius: 999px;
        color: #e6edf3;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.25s ease;
        width: fit-content;
      }
      .back-btn:hover {
        background: rgba(77, 208, 225, 0.18);
        border-color: var(--accent);
        color: #fff;
        transform: translateX(-3px);
        box-shadow: 0 4px 14px rgba(77, 208, 225, 0.25);
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      /* ===== SUBJECT FILTER CHIPS ===== */
      .filter-row {
        width: 100%;
        max-width: 600px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .chip {
        padding: 7px 13px;
        border-radius: 999px;
        background: #171d28;
        border: 1px solid var(--border);
        font-size: 12px;
        font-weight: 700;
        color: var(--text-dim);
        transition: all 0.18s;
        cursor: pointer;
        font-family: inherit;
      }
      .chip:hover {
        border-color: var(--border-2);
        color: var(--text);
      }
      .chip.active {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-color: transparent;
        color: #fff;
        box-shadow: 0 3px 10px rgba(77, 208, 225, 0.3);
      }
      .mode-row {
        width: 100%;
        max-width: 600px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        padding: 10px 12px;
        background: #10151d;
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .mode-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 9px 14px;
        border-radius: 10px;
        background: #171d28;
        border: 1px solid var(--border);
        font-size: 12px;
        font-weight: 700;
        color: var(--text-dim);
        transition: all 0.18s;
        cursor: pointer;
        font-family: inherit;
      }
      .mode-btn:hover {
        border-color: var(--border-2);
        color: var(--text);
      }
      .mode-btn.active {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-color: transparent;
        color: #fff;
        box-shadow: 0 3px 10px rgba(77, 208, 225, 0.3);
      }
      .mode-btn#shuffleNowBtn {
        margin-left: auto;
      }
      @media (max-width: 420px) {
        .mode-btn#shuffleNowBtn {
          margin-left: 0;
        }
      }

      /* ===== FLASHCARD ===== */
      .flashcard-container {
        width: 100%;
        max-width: 600px;
        height: 420px;
        perspective: 1000px;
        margin-bottom: 20px;
      }
      .flashcard {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        cursor: pointer;
      }
      .flashcard.is-flipped {
        transform: rotateY(180deg);
      }
      .flashcard-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 50px 40px 40px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        overflow-y: auto;
      }
      .flashcard-face::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        border-radius: 16px 16px 0 0;
      }
      .flashcard-face.back {
        transform: rotateY(180deg);
        background: linear-gradient(
          135deg,
          rgba(77, 208, 225, 0.05),
          rgba(77, 159, 255, 0.05)
        );
      }
      .subject-badge {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        white-space: nowrap;
        border: 1px solid;
        max-width: 90%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .subject-anatomy {
        color: #4dd0e1;
        background: rgba(77, 208, 225, 0.12);
        border-color: rgba(77, 208, 225, 0.4);
      }
      .subject-physiology {
        color: #26c6da;
        background: rgba(38, 198, 218, 0.12);
        border-color: rgba(38, 198, 218, 0.4);
      }
      .subject-pathology {
        color: #4d9fff;
        background: rgba(77, 159, 255, 0.12);
        border-color: rgba(77, 159, 255, 0.4);
      }
      .subject-pharmacology {
        color: #00bcd4;
        background: rgba(0, 188, 212, 0.12);
        border-color: rgba(0, 188, 212, 0.4);
      }
      .subject-microbiology {
        color: #18ffff;
        background: rgba(24, 255, 255, 0.1);
        border-color: rgba(24, 255, 255, 0.3);
      }
      .subject-biochemistry {
        color: #00e5ff;
        background: rgba(0, 229, 255, 0.1);
        border-color: rgba(0, 229, 255, 0.3);
      }

      .card-label {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 20px;
      }
      .front .card-label {
        color: var(--accent);
      }
      .back .card-label {
        color: var(--accent-2);
      }
      .card-content {
        font-size: 18px;
        line-height: 1.6;
        font-weight: 600;
        max-height: 100%;
        overflow-y: auto;
        padding: 4px;
      }
      .back .card-content {
        font-size: 16px;
        font-weight: 500;
        color: #c9d1d9;
        text-align: left;
      }

      /* ===== CONTROLS ===== */
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 10px;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        padding: 12px 24px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        transition: all 0.2s;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
        background: #1a2130;
      }
      button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-color: transparent;
        color: #fff;
        box-shadow: 0 4px 14px rgba(77, 208, 225, 0.3);
      }
      button.primary:hover:not(:disabled) {
        box-shadow: 0 6px 20px rgba(77, 208, 225, 0.4);
        transform: translateY(-1px);
      }
      .counter {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-dim);
        min-width: 60px;
        text-align: center;
      }
      .hint {
        margin-top: 20px;
        font-size: 12px;
        color: var(--text-dim);
        text-align: center;
      }

      /* ===== SECTIONED NAVIGATOR GRID ===== */
      .q-nav-section {
        width: 100%;
        max-width: 600px;
        margin-top: 24px;
      }
      .q-nav-section-title {
        font-size: 11px;
        font-weight: 800;
        color: var(--text-faint);
        text-transform: uppercase;
        letter-spacing: 1.2px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .q-nav-section-title .count {
        background: #171d28;
        color: var(--text-dim);
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
      }
      .section-group {
        margin-bottom: 22px;
      }
      .section-header {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 10px;
        padding: 0 4px;
      }
      .section-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .section-name {
        font-size: 11.5px;
        font-weight: 800;
        letter-spacing: 0.9px;
        text-transform: uppercase;
        color: var(--text);
      }
      .section-range {
        font-size: 10px;
        font-weight: 700;
        color: var(--text-faint);
        margin-left: auto;
      }
      .q-nav-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        padding: 14px;
        background: #10151d;
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .q-nav-btn {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: #171d28;
        border: 1px solid var(--border);
        font-size: 12px;
        font-weight: 800;
        color: var(--text-dim);
        transition: all 0.15s;
        padding: 0;
        cursor: pointer;
      }
      .q-nav-btn:hover {
        border-color: var(--accent-2);
        color: var(--text);
      }
      .q-nav-btn.current {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #fff;
        border-color: transparent;
        box-shadow: 0 4px 14px rgba(77, 208, 225, 0.4);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 14px;
        padding: 12px 16px;
        background: #10151d;
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-dim);
      }
      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: #171d28;
        border: 1px solid var(--border-2);
        padding: 12px 22px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s;
        z-index: 100;
        white-space: nowrap;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <a href="index.html" class="back-btn">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Back to Main Page
      </a>
      <h1>MSK Flashcards</h1>
    </div>

    <div class="filter-row" id="filterRow"></div>

    <div class="mode-row">
      <button
        class="mode-btn active"
        id="modeSequential"
        onclick="setMode('sequential')"
      >
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        Sequential
      </button>
      <button class="mode-btn" id="modeRandom" onclick="setMode('random')">
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5" />
        </svg>
        Random
      </button>
      <button
        class="mode-btn"
        id="shuffleNowBtn"
        onclick="reshuffle()"
        title="Reshuffle"
      >
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"
          />
        </svg>
        Reshuffle
      </button>
    </div>

    <div class="flashcard-container">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="flashcard-face front">
          <span class="subject-badge" id="subjectFront">Subject</span>
          <span class="card-label">Question</span>
          <div class="card-content" id="questionText">Loading...</div>
        </div>
        <div class="flashcard-face back">
          <span class="subject-badge" id="subjectBack">Subject</span>
          <span class="card-label">Answer</span>
          <div class="card-content" id="answerText">Loading...</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="prevBtn" onclick="prevCard()">← Prev</button>
      <div class="counter" id="counter">1 / 1</div>
      <button id="nextBtn" class="primary" onclick="nextCard()">Next →</button>
    </div>

    <div class="hint">Click the card to flip · Use ← → keys to navigate</div>

    <div class="q-nav-section">
      <div class="q-nav-section-title">
        Jump to Question
        <span class="count" id="navCount">0</span>
      </div>
      <div id="sectionsWrapper"></div>

      <div class="legend">
        <span class="legend-item"
          ><span class="legend-dot" style="background: #4dd0e1"></span
          >Anatomy</span
        >
        <span class="legend-item"
          ><span class="legend-dot" style="background: #4d9fff"></span
          >Pathology</span
        >
        <span class="legend-item"
          ><span class="legend-dot" style="background: #00bcd4"></span
          >Pharmacology</span
        >
        <span class="legend-item"
          ><span class="legend-dot" style="background: #00e5ff"></span
          >Biochemistry</span
        >
        <span class="legend-item"
          ><span class="legend-dot" style="background: #18ffff"></span
          >Microbiology</span
        >
      </div>
    </div>

    <script>
      /* ============================================================
         FLASHCARD DATA
         ------------------------------------------------------------
         Format: { s: "Subject", section: "Section Name", q: "Question", a: "Answer" }
         Subjects: Anatomy | Pathology | Pharmacology | Biochemistry | Microbiology
         ============================================================ */

      const flashcards = [
        // ==================== INTEGUMENTARY SYSTEM ====================
        // ==================== UPPER LIMB ====================
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Which of the following joints represents the ONLY articulation between the superior appendicular skeleton and the axial skeleton?",
          a: "Sternoclavicular joint. It allows for a high degree of mobility for the upper limb.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "A 22-year-old cyclist falls onto his shoulder and sustains a fracture of the clavicle. Where is the most common and anatomically weakest site of fracture on the clavicle?",
          a: "Junction of the middle and lateral thirds.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Following a complete fracture of the clavicle at its weakest point, which muscle elevates the medial fragment?",
          a: "Sternocleidomastoid (SCM). The lateral fragment drops due to the weight of the limb.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Over which ribs does the triangular blade of the scapula lie on the posterolateral thorax?",
          a: "2nd to 7th ribs.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Which region of the humerus is clinically recognized as the most frequent site of fracture?",
          a: "Surgical neck.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "A fracture of the surgical neck of the humerus most likely injures which nerve?",
          a: "Axillary nerve.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "A mid-shaft fracture of the humerus at the level of the radial groove most likely compromises which nerve?",
          a: "Radial nerve.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "A fracture of the medial epicondyle of the humerus most likely injures which nerve?",
          a: "Ulnar nerve.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Which statement about the distal articulation of the ulna is CORRECT?",
          a: "The ulna does not reach and does not participate in the wrist (radiocarpal) joint.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "In a Colles fracture, which statement is FALSE?",
          a: "FALSE: 'The radial styloid process is mostly avulsed while the ulnar styloid remains intact.' In reality, the distal radial fragment is displaced dorsally and the ulnar styloid is often avulsed.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Which carpal bone is the largest bone in the distal row of the wrist?",
          a: "Capitale.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "The pisiform bone of the proximal carpal row rests directly on the palmar surface of which carpal bone?",
          a: "Triquetrum.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Which carpal bone has a prominent hooked projection on its palmar aspect?",
          a: "Hamate (hook of hamate).",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "The 'knuckles' of the hand are formed by which articulation?",
          a: "Distal metacarpal heads and proximal phalanges.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "How many phalanges does the thumb have compared to digits 2 through 5?",
          a: "Thumb has 2 phalanges (proximal, distal); digits 2–5 have 3 phalanges each (proximal, middle, distal).",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "The brachial fascia sends two intermuscular septa to the humerus. What fascial compartments do these septa create?",
          a: "Anterior (flexor) and posterior (extensor) compartments of the arm.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "What structure is formed by the posterior thickening of the antebrachial fascia across the distal forearm?",
          a: "Extensor retinaculum.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "What is the central, thick, triangular portion of the deep fascia in the palm that radiates into four bands to digits 2 through 5?",
          a: "Palmar aponeurosis.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Cutaneous nerves supplying the shoulder region originate from which neural plexus?",
          a: "Cervical plexus.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Which dermatome supplies sensation to the lateral aspect of the arm?",
          a: "C5.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "A patient loses sensation over the lateral forearm and the thumb. Which dermatome is impacted?",
          a: "C6.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Sensation over the middle three fingers is mediated by which spinal segment?",
          a: "C7.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Which dermatome supplies the little finger and the medial side of the hand and wrist?",
          a: "C8.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Which dermatome covers the medial forearm extending up toward the axilla?",
          a: "T1.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Which superficial vein travels in the deltopectoral groove and drains into the axillary vein?",
          a: "Cephalic vein.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Near the middle-inferior third of the arm, which fascia does the basilic vein pierce?",
          a: "Brachial fascia.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Which vein is most commonly selected for routine venipuncture in the cubital fossa?",
          a: "Median cubital vein.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Which veins are most frequently used for long-term IV fluid therapy?",
          a: "Veins of the dorsal venous network, cephalic vein, and basilic vein.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Between which two structures is the retromammary space located?",
          a: "Breast tissue and the underlying pectoral fascia.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Fibrous bands attaching the mammary gland lobes to skin and pectoral fascia are called?",
          a: "Suspensory ligaments of Cooper.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",
          q: "Where does milk accumulate during lactation prior to release through the nipple?",
          a: "Lactiferous sinuses.",
        },
        {
          s: "Anatomy",
          section: "Upper Limb",

        // ==================== MUSCULOSKELETAL MICROBIOLOGY ====================
        {
          s: "Microbiology",
          section: "Musculoskeletal Microbiology",
          q: "[Microbiology questions coming soon — no MCQs were provided in your MSK QUIZ_DATA yet.]",
          a: "Placeholder — replace this card once microbiology MCQs are added.",
        },
      ];

      /* ============================================================
         SECTION CONFIG — order, colors, subject for each section
         ============================================================ */
      const SECTION_CONFIG = {
        "Integumentary System": { color: "#4dd0e1", subject: "Anatomy" },
        "Upper Limb": { color: "#26c6da", subject: "Anatomy" },

        // ==================== MUSCULOSKELETAL PHARMACOLOGY ====================
        "Lower Limb": { color: "#00bcd4", subject: "Anatomy" },
        Histology: { color: "#4d9fff", subject: "Anatomy" },
        Embryology: { color: "#00e5ff", subject: "Anatomy" },
        "Bone & Joint Pathology": { color: "#4d9fff", subject: "Pathology" },
        "Muscle Pathology": { color: "#4d9fff", subject: "Pathology" },
        "Skin Pathology": { color: "#4d9fff", subject: "Pathology" },
        "Musculoskeletal Pharmacology": {
          color: "#00bcd4",
          subject: "Pharmacology",
        },
        "Musculoskeletal Biochemistry": {
          color: "#00e5ff",
          subject: "Biochemistry",
        },
        "Musculoskeletal Microbiology": {
          color: "#18ffff",
          subject: "Microbiology",
        },
      };

      const SECTION_ORDER = Object.keys(SECTION_CONFIG);

      const SUBJECT_CLASS = {
        Anatomy: "subject-anatomy",
        Physiology: "subject-physiology",
        Pathology: "subject-pathology",
        Pharmacology: "subject-pharmacology",
        Microbiology: "subject-microbiology",
        Biochemistry: "subject-biochemistry",
      };

      function getSubjectClass(subject) {
        return SUBJECT_CLASS[subject] || "subject-anatomy";
      }

      // ============================================================
      // STATE
      // ============================================================
      let activeFilter = "All"; // "All" or a subject name
      let mode = "sequential"; // "sequential" or "random"
      let baseCards = flashcards.slice(); // cards after filter, before randomize
      let filteredCards = flashcards.slice(); // cards currently shown
      let currentIndex = 0;
      let isFlipped = false;

      // ============================================================
      // SHUFFLE HELPERS
      // ============================================================
      function shuffleArray(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function setMode(newMode) {
        mode = newMode;
        document
          .getElementById("modeSequential")
          .classList.toggle("active", mode === "sequential");
        document
          .getElementById("modeRandom")
          .classList.toggle("active", mode === "random");
        applyFilter();
      }

      function reshuffle() {
        if (mode !== "random") {
          setMode("random");
        } else {
          applyFilter();
        }
        showToast("🔀 Shuffled!");
      }

      function showToast(msg) {
        let toast = document.getElementById("toast");
        if (!toast) {
          toast = document.createElement("div");
          toast.id = "toast";
          toast.className = "toast";
          document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove("show"), 1500);
      }

      const flashcardEl = document.getElementById("flashcard");
      const questionEl = document.getElementById("questionText");
      const answerEl = document.getElementById("answerText");
      const counterEl = document.getElementById("counter");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const subjectFront = document.getElementById("subjectFront");
      const subjectBack = document.getElementById("subjectBack");
      const sectionsWrapper = document.getElementById("sectionsWrapper");
      const navCount = document.getElementById("navCount");
      const filterRow = document.getElementById("filterRow");

      // ============================================================
      // BUILD SECTIONED NAVIGATOR GRID
      // ============================================================
      function buildSectionsGrid() {
        sectionsWrapper.innerHTML = "";
        navCount.textContent = flashcards.length;

        // Group by section, preserving SECTION_ORDER
        const groups = {};
        flashcards.forEach((card, idx) => {
          const sec = card.section || "Other";
          if (!groups[sec]) groups[sec] = [];
          groups[sec].push({ card, idx });
        });

        // Render in SECTION_ORDER, then any extras
        const orderedSections = [
          ...SECTION_ORDER.filter((s) => groups[s]),
          ...Object.keys(groups).filter((s) => !SECTION_ORDER.includes(s)),
        ];

        orderedSections.forEach((secName) => {
          const items = groups[secName];
          const cfg = SECTION_CONFIG[secName] || {
            color: "#8b949e",
            subject: "Anatomy",
          };
          const firstNum = items[0].idx + 1;
          const lastNum = items[items.length - 1].idx + 1;

          const group = document.createElement("div");
          group.className = "section-group";

          const header = document.createElement("div");
          header.className = "section-header";
          header.innerHTML = `
            <span class="section-dot" style="background:${cfg.color};box-shadow:0 0 8px ${cfg.color}88;"></span>
            <span class="section-name">${secName}</span>
            <span class="section-range">${firstNum}–${lastNum}</span>
          `;

          const grid = document.createElement("div");
          grid.className = "q-nav-grid";

          items.forEach(({ idx }) => {
            const btn = document.createElement("button");
            btn.className = "q-nav-btn";
            btn.textContent = idx + 1;
            btn.dataset.qIndex = idx;
            btn.addEventListener("click", () => {
              // If the current filter hides this card, reset to "All"
              const inFiltered = filteredCards.findIndex(
                (c) => flashcards.indexOf(c) === idx,
              );
              if (inFiltered === -1) {
                activeFilter = "All";
                filteredCards = flashcards.slice();
                buildFilterChips();
              }
              const newIdx = filteredCards.findIndex(
                (c) => flashcards.indexOf(c) === idx,
              );
              if (newIdx !== -1) jumpTo(newIdx);
            });
            grid.appendChild(btn);
          });

          group.appendChild(header);
          group.appendChild(grid);
          sectionsWrapper.appendChild(group);
        });
      }

      function updateGridHighlight() {
        const currentCard = filteredCards[currentIndex];
        const globalIdx = currentCard ? flashcards.indexOf(currentCard) : -1;
        document.querySelectorAll(".q-nav-btn").forEach((btn) => {
          const btnIdx = parseInt(btn.dataset.qIndex);
          if (btnIdx === globalIdx) btn.classList.add("current");
          else btn.classList.remove("current");
        });
      }

      // ============================================================
      // FILTER CHIPS
      // ============================================================
      function buildFilterChips() {
        const counts = {};
        flashcards.forEach((c) => {
          const s = c.s || "Other";
          counts[s] = (counts[s] || 0) + 1;
        });
        const subjects = ["All", ...Object.keys(counts).sort()];
        filterRow.innerHTML = "";

        subjects.forEach((s) => {
          const btn = document.createElement("button");
          btn.className = "chip" + (s === activeFilter ? " active" : "");
          btn.textContent =
            s === "All" ? `All (${flashcards.length})` : `${s} (${counts[s]})`;
          btn.addEventListener("click", () => {
            activeFilter = s;
            applyFilter();
            buildFilterChips();
          });
          filterRow.appendChild(btn);
        });
      }

      function applyFilter() {
        // Step 1: filter by subject
        baseCards =
          activeFilter === "All"
            ? flashcards.slice()
            : flashcards.filter((c) => c.s === activeFilter);

        // Step 2: apply mode
        if (mode === "random") {
          filteredCards = shuffleArray(baseCards);
        } else {
          filteredCards = baseCards.slice();
        }

        currentIndex = 0;
        updateCard();
      }

      function jumpTo(index) {
        if (index < 0 || index >= filteredCards.length) return;
        currentIndex = index;
        updateCard();
        // Scroll the active button into view
        const currentCard = filteredCards[currentIndex];
        const globalIdx = flashcards.indexOf(currentCard);
        const activeBtn = document.querySelector(
          `.q-nav-btn[data-q-index="${globalIdx}"]`,
        );
        if (activeBtn)
          activeBtn.scrollIntoView({ behavior: "smooth", block: "nearest" });
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // ============================================================
      // CARD LOGIC
      // ============================================================
      function updateCard() {
        const card = filteredCards[currentIndex];
        if (!card) {
          questionEl.textContent = "No cards available.";
          answerEl.textContent = "—";
          counterEl.textContent = "0 / 0";
          prevBtn.disabled = true;
          nextBtn.disabled = true;
          return;
        }

        flashcardEl.classList.remove("is-flipped");
        isFlipped = false;

        const subjectClass = getSubjectClass(card.s);
        subjectFront.textContent = card.s;
        subjectFront.className = "subject-badge " + subjectClass;
        subjectBack.textContent = card.s;
        subjectBack.className = "subject-badge " + subjectClass;

        questionEl.textContent = card.q;
        answerEl.textContent = card.a;

        counterEl.textContent = `${currentIndex + 1} / ${filteredCards.length}`;
        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === filteredCards.length - 1;

        updateGridHighlight();
      }

      function flipCard() {
        flashcardEl.classList.toggle("is-flipped");
        isFlipped = !isFlipped;
      }

      function nextCard() {
        if (currentIndex < filteredCards.length - 1) {
          currentIndex++;
          updateCard();
        }
      }

      function prevCard() {
        if (currentIndex > 0) {
          currentIndex--;
          updateCard();
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") nextCard();
        if (e.key === "ArrowLeft") prevCard();
        if (e.key === " ") {
          e.preventDefault();
          flipCard();
        }
      });

      // ============================================================
      // BOOT
      // ============================================================
      buildSectionsGrid();
      buildFilterChips();
      applyFilter();
    </script>
