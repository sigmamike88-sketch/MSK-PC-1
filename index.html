<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e14" />
<title>MSK — Past Year Exams</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦴</text></svg>" />
<style>
  :root {
    --bg: #0a0e14;
    --bg-2: #10151d;
    --bg-3: #171d28;
    --card: #121821;
    --card-hover: #1a2130;
    --border: #1f2836;
    --border-2: #2b3648;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --text-faint: #5a6472;
    --accent: #00bfa5;
    --accent-2: #4d9fff;
    --green: #2ecc71;
    --red: #e74c3c;
    --blue: #4d9fff;
    --yellow: #f5b800;
    --radius: 16px;
    --radius-sm: 10px;
    --radius-xs: 8px;
    --shadow: 0 4px 20px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; }
  a { color: inherit; text-decoration: none; }

  #app { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }

  .topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    background: rgba(10,14,20,0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .logo-badge {
    width: 34px; height: 34px; border-radius: 10px;
    display: grid; place-items: center; font-size: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    flex-shrink: 0;
  }
  .logo-text { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; line-height: 1.1; }
  .logo-sub  { font-size: 11px; color: var(--text-dim); line-height: 1.1; }
  .topbar-spacer { flex: 1; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--bg-3); border: 1px solid var(--border);
    font-size: 15px;
    transition: background .15s, transform .1s;
  }
  .icon-btn:hover { background: var(--card-hover); }
  .icon-btn:active { transform: scale(0.94); }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; flex-shrink: 0;
  }

  .wrap { padding: 16px 14px 40px; }

  .crumbs {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-dim);
    margin-bottom: 10px; flex-wrap: wrap;
  }
  .crumb { color: var(--text-dim); cursor: default; }
  .crumb.link { cursor: pointer; }
  .crumb.link:hover { color: var(--accent); }
  .crumb.active { color: var(--text); font-weight: 600; }

  .hero {
    position: relative; overflow: hidden;
    border-radius: var(--radius);
    padding: 20px 18px;
    background: linear-gradient(135deg, rgba(0,191,165,0.18), rgba(77,159,255,0.12));
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .hero h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 4px; }
  .hero p { font-size: 13px; color: var(--text-dim); }
  .hero-stats { display: flex; gap: 18px; margin-top: 14px; flex-wrap: wrap; }
  .hero-stat { display: flex; flex-direction: column; }
  .hero-stat .n { font-size: 20px; font-weight: 800; }
  .hero-stat .l { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }

  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-wrap input {
    width: 100%;
    padding: 12px 14px 12px 40px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text); font-size: 14px; outline: none;
    transition: border-color .15s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--text-faint); }
  .search-wrap::before {
    content: "🔍";
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%);
    font-size: 14px; opacity: 0.6; pointer-events: none;
  }

  .section-title {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-dim);
    margin: 20px 2px 10px;
  }

  .list { display: flex; flex-direction: column; gap: 10px; }

  .course-card {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    width: 100%; text-align: left;
    padding: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    transition: background .15s, transform .1s, border-color .15s;
    overflow: hidden;
  }
  .course-card::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--course-color, var(--accent));
  }
  .course-card:hover { background: var(--card-hover); border-color: var(--border-2); }
  .course-card:active { transform: scale(0.985); }

  .course-thumb {
    width: 46px; height: 46px;
    border-radius: 12px;
    display: grid; place-items: center;
    font-size: 22px;
    background: var(--course-bg, rgba(0,191,165,0.12));
    border: 1px solid var(--course-border, rgba(0,191,165,0.3));
    flex-shrink: 0;
  }
  .course-info { flex: 1; min-width: 0; }
  .course-name {
    font-size: 15px; font-weight: 700;
    letter-spacing: -0.2px; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .course-meta {
    font-size: 12px; color: var(--text-dim);
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .course-arrow { color: var(--text-faint); font-size: 18px; flex-shrink: 0; }

  .badge-year {
    display: inline-block;
    padding: 3px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 800;
    background: var(--course-bg, rgba(0,191,165,0.12));
    color: var(--course-color, var(--accent));
    border: 1px solid var(--course-border, rgba(0,191,165,0.3));
  }
  .year-status {
    font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px; flex-shrink: 0;
  }
  .year-status.new      { background: rgba(77,159,255,0.15); color: var(--blue); }
  .year-status.progress { background: rgba(245,184,0,0.15);  color: var(--yellow); }
  .year-status.done     { background: rgba(46,204,113,0.15); color: var(--green); }

  .progress-bar {
    height: 4px;
    background: var(--bg-3);
    border-radius: 999px; overflow: hidden; margin-top: 8px;
  }
  .progress-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--course-color, var(--accent)), var(--course-color-2, var(--accent-2)));
    transition: width .3s ease;
  }

  .continue-card {
    display: flex; align-items: center; gap: 12px;
    padding: 14px;
    background: linear-gradient(135deg, rgba(0,191,165,0.14), rgba(77,159,255,0.08));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 6px;
  }

  .quiz-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    position: sticky; top: 0; z-index: 40;
    background: rgba(10,14,20,0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .quiz-progress { height: 3px; background: var(--bg-3); overflow: hidden; }
  .quiz-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .3s ease;
  }
  .quiz-body { padding: 18px 14px 120px; }
  .quiz-title { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 4px; }
  .quiz-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 18px; }
  .q-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .q-num {
    font-size: 12px; font-weight: 700; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .topic-badge, .streak-badge {
    font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px;
  }
  .topic-badge { background: rgba(0,191,165,0.12); color: var(--accent); border: 1px solid rgba(0,191,165,0.3); }
  .streak-badge { background: rgba(245,184,0,0.12); color: var(--yellow); border: 1px solid rgba(245,184,0,0.3); }
  .q-text { font-size: 16px; font-weight: 600; line-height: 1.55; margin-bottom: 18px; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    text-align: left;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .option:hover:not(.disabled) { background: var(--card-hover); border-color: var(--border-2); }
  .option:active:not(.disabled) { transform: scale(0.99); }
  .option.disabled { cursor: default; }
  .option.correct { border-color: var(--green); background: rgba(46,204,113,0.1); }
  .option.wrong   { border-color: var(--red);   background: rgba(231,76,60,0.1); }
  .letter {
    width: 26px; height: 26px; border-radius: 7px;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 800;
    background: var(--bg-3); border: 1px solid var(--border);
    flex-shrink: 0; margin-top: 1px;
  }
  .option.correct .letter { background: var(--green); color: #fff; border-color: var(--green); }
  .option.wrong   .letter { background: var(--red);   color: #fff; border-color: var(--red); }
  .option-text { font-size: 14px; line-height: 1.5; flex: 1; }

  .result-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-radius: var(--radius-sm);
    margin-top: 16px; font-size: 13px; font-weight: 600;
  }
  .result-row.correct { background: rgba(46,204,113,0.12); border: 1px solid rgba(46,204,113,0.3); color: var(--green); }
  .result-row.wrong   { background: rgba(231,76,60,0.12); border: 1px solid rgba(231,76,60,0.3); color: var(--red); }

  .explanation {
    margin-top: 12px; padding: 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  .explanation-label {
    font-size: 11px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--accent); margin-bottom: 6px;
  }
  .explanation-text { font-size: 14px; line-height: 1.6; color: var(--text); }
  .explanation-text strong { color: var(--accent); }

  .q-nav {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
    gap: 6px; margin-top: 20px; max-height: 220px; overflow-y: auto;
    padding: 2px;
  }
  .q-nav-btn {
    aspect-ratio: 1; border-radius: 8px;
    font-size: 12px; font-weight: 700;
    background: var(--bg-3); border: 1px solid var(--border);
    color: var(--text-dim);
    display: grid; place-items: center;
    transition: transform .1s;
  }
  .q-nav-btn:active { transform: scale(0.92); }
  .q-nav-btn.current { background: var(--accent); color: #fff; border-color: var(--accent); }
  .q-nav-btn.correct { background: rgba(46,204,113,0.2); color: var(--green); border-color: rgba(46,204,113,0.4); }
  .q-nav-btn.wrong   { background: rgba(231,76,60,0.2);  color: var(--red);   border-color: rgba(231,76,60,0.4); }

  .nav-actions {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; gap: 10px;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: rgba(10,14,20,0.95);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    z-index: 30;
  }
  .nav-btn {
    flex: 1; padding: 13px;
    border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 700;
    background: var(--bg-3); border: 1px solid var(--border);
    color: var(--text);
    transition: background .15s, transform .1s;
  }
  .nav-btn:hover:not(:disabled) { background: var(--card-hover); }
  .nav-btn:active:not(:disabled) { transform: scale(0.97); }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .nav-btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #fff;
  }

  .finish-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 14px; }
  .finish-card {
    width: 100%; max-width: 420px; text-align: center;
    padding: 32px 22px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .finish-emoji { font-size: 56px; margin-bottom: 10px; }
  .finish-score {
    font-size: 40px; font-weight: 800; letter-spacing: -1px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .finish-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 22px; }
  .finish-btns { display: flex; flex-direction: column; gap: 10px; }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--text-dim); }
  .empty-state .emoji { font-size: 42px; margin-bottom: 10px; }
  .empty-state .title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .empty-state .sub { font-size: 13px; }

  .toast {
    position: fixed; left: 50%;
    bottom: calc(30px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    padding: 11px 18px;
    background: var(--bg-3); border: 1px solid var(--border-2);
    border-radius: 999px;
    font-size: 13px; font-weight: 600; color: var(--text);
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 100; white-space: nowrap;
    box-shadow: var(--shadow);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (min-width: 700px) {
    #app { max-width: 680px; margin: 0 auto; }
    .quiz-header { max-width: 680px; margin: 0 auto; }
    .nav-actions { max-width: 680px; margin: 0 auto; left: 50%; transform: translateX(-50%); }
  }
</style>
</head>

/* ---------- STATE & STORAGE ---------- */
function loadProgress()  { try { return JSON.parse(localStorage.getItem(STORAGE_KEY))  || {}; } catch { return {}; } }
function saveProgress()  { localStorage.setItem(STORAGE_KEY,  JSON.stringify(state.progress)); }
function loadBookmarks() { try { return JSON.parse(localStorage.getItem(BOOKMARK_KEY)) || {}; } catch { return {}; } }
function saveBookmarks() { localStorage.setItem(BOOKMARK_KEY, JSON.stringify(state.bookmarks)); }

const state = {
  view: "courses",
  search: "",
  course: null,
  noteSubject: null,
  pptSubject: null,
  pptTeacher: null,
  activeNote: null,
  exam: null,
  qIndex: 0,
  showExplanation: false,
  streak: 0,
  startTime: null,
  progress: loadProgress(),
  bookmarks: loadBookmarks(),
};

/* ---------- UTILITIES ---------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[c]);
}
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 1800);
}
function getCourses() {
  return [...new Set(QUIZ_DATA.map(e => e.subject))];
}
function getExamProgress(exam) {
  const p = state.progress[exam.id] || {};
  const answered = Object.keys(p).length;
  const correct = Object.values(p).filter(v => v.correct).length;
  return { answered, correct, total: exam.questions.length };
}
function getCourseProgress(subject) {
  const exams = QUIZ_DATA.filter(e => e.subject === subject);
  const total    = exams.reduce((s, e) => s + e.questions.length, 0);
  const answered = exams.reduce((s, e) => s + Object.keys(state.progress[e.id] || {}).length, 0);
  const correct  = exams.reduce((s, e) =>
    s + Object.values(state.progress[e.id] || {}).filter(v => v.correct).length, 0);
  return { answered, correct, total, examsCount: exams.length };
}

/* ---------- ROUTER ---------- */
function render() {
  if (state.view === "quiz")         return renderQuiz();
  if (state.view === "finish")       return renderFinish();
  if (state.view === "years")        return renderYears();
  if (state.view === "notes")        return renderNotesCourses();
  if (state.view === "note")         return renderNoteDetail();
  if (state.view === "ppts")         return renderPptsCourses();
  if (state.view === "ppt-teachers") return renderPptsTeachers();
  if (state.view === "ppt-files")    return renderPptsFiles();
  if (state.view === "bookmarks")    return renderBookmarks();
  renderCourses();
}

function openExam(exam) {
  state.exam = exam;
  state.qIndex = 0;
  state.showExplanation = false;
  state.streak = 0;
  state.startTime = Date.now();
  const p = state.progress[exam.id] || {};
  const answeredIdx = Object.keys(p).map(Number).sort((a,b) => a-b);
  if (answeredIdx.length && answeredIdx.length < exam.questions.length) {
    const firstGap = exam.questions.findIndex((_, i) => !(i in p));
    state.qIndex = firstGap >= 0 ? firstGap : answeredIdx[answeredIdx.length - 1] + 1;
  } else if (answeredIdx.length === exam.questions.length) {
    state.qIndex = 0;
  }
  state.view = "quiz";
  render();
}

    if (i === state.qIndex) btn.classList.add("current");
    btn.textContent = i + 1;
    btn.onclick = () => { state.qIndex = i; state.showExplanation = false; render(); };
    qNav.appendChild(btn);
  });

  const prev = document.getElementById("btnPrev");
  if (prev) prev.onclick = () => {
    if (state.qIndex > 0) { state.qIndex--; state.showExplanation = false; render(); }
  };
  const next = document.getElementById("btnNext");
  if (next) next.onclick = () => {
    if (state.qIndex < exam.questions.length - 1) { state.qIndex++; state.showExplanation = false; render(); }
  };
  const finish = document.getElementById("btnFinish");
  if (finish) finish.onclick = () => { state.view = "finish"; render(); };
}

function pickAnswer(letter) {
  const exam = state.exam;
  const q = exam.questions[state.qIndex];
  const correct = letter === q.correct;
  if (!state.progress[exam.id]) state.progress[exam.id] = {};
  state.progress[exam.id][state.qIndex] = { chosen: letter, correct, t: Date.now() };
  state.streak = correct ? state.streak + 1 : 0;
  saveProgress();
  render();
}

/* ---------- FINISH VIEW ---------- */
function renderFinish() {
  const exam = state.exam;
  const pr = getExamProgress(exam);
  const pct = pr.total ? Math.round((pr.correct / pr.total) * 100) : 0;
  const emoji = pct >= 100 ? "🏆" : pct >= 80 ? "🌟" : pct >= 60 ? "👍" : pct >= 40 ? "📖" : "💪";
  const elapsed = state.startTime ? Math.round((Date.now() - state.startTime) / 1000) : 0;
  const mm = Math.floor(elapsed / 60);
  const ss = elapsed % 60;

  const app = document.getElementById("app");
  app.innerHTML = `
    ${topbar()}
    <div class="finish-wrap">
      <div class="finish-card">
        <div class="finish-emoji">${emoji}</div>
        <div class="finish-score">${pct}%</div>
        <div class="finish-sub">
          ${pr.correct} of ${pr.total} correct
          ${elapsed ? ` · ${mm}m ${ss}s` : ""}
        </div>
        <div class="finish-btns">
          <button class="nav-btn primary" id="fReview">Review Answers</button>
          <button class="nav-btn" id="fBack">Back to Years</button>
          <button class="nav-btn" id="fRetry">Retry Exam</button>
        </div>
      </div>
    </div>
  `;
  bindTopbar();
  document.getElementById("fReview").onclick = () => {
    state.qIndex = 0; state.showExplanation = true; state.view = "quiz"; render();
  };
  document.getElementById("fBack").onclick = () => { state.view = "years"; render(); };
  document.getElementById("fRetry").onclick = () => {
    delete state.progress[exam.id]; saveProgress();
    state.qIndex = 0; state.streak = 0; state.startTime = Date.now();
    state.view = "quiz"; render();
  };
}

/* ---------- KEYBOARD SHORTCUTS ---------- */
document.addEventListener("keydown", (e) => {
  if (state.view !== "quiz") return;
  const exam = state.exam;
  if (!exam) return;
  const q = exam.questions[state.qIndex];
  if (!q) return;
  const key = e.key.toUpperCase();
  if (/^[A-E]$/.test(key)) {
    const exists = q.options.some(o => o.letter === key);
    if (exists && !(state.progress[exam.id] || {})[state.qIndex]) {
      pickAnswer(key);
      e.preventDefault();
    }
  } else if (e.key === "ArrowLeft" && state.qIndex > 0) {
    state.qIndex--; state.showExplanation = false; render(); e.preventDefault();
  } else if (e.key === "ArrowRight" && state.qIndex < exam.questions.length - 1) {
    state.qIndex++; state.showExplanation = false; render(); e.preventDefault();
  } else if (e.key === "Escape") {
    state.view = "years"; render();
  }
});

/* ---------- BOOT ---------- */
render();
